[package]
name = "agent-vitals-ingest"
version = "1.4.0"
edition = "2021"
rust-version = "1.74"
description = "Agent Vitals runtime layer: ingest (W3 split)"
repository = "https://github.com/Oh-Agent-AI/oh-agent"
license = "MIT"

[lib]
name = "agent_vitals_ingest"
path = "src/lib.rs"

[features]
# P2 watcher（SourceGraph spec §9-P2）：notify 6.x 文件事件 → 去抖 → 唤醒 tick。
# 不开 = NoopWatcher（tick 5min 兜底照常）。runtime 门面的同名 feature 转发到这里。
watcher = ["dep:notify"]

[dependencies]
agent-vitals-billing = { path = "../agent-vitals-billing" }
agent-vitals-data = { path = "../agent-vitals-data" }
agent-vitals-domain = { path = "../agent-vitals-domain" }
agent-vitals-harnesses = { path = "../agent-vitals-harnesses", features = ["sources"] }
agent-vitals-provider = { path = "../agent-vitals-provider" }
# E04 安装器直接使用 core 的不可变对象存储（extension_objects）。runtime-core
# 是叶子 core crate，无反向依赖，不引入环。
agent-vitals-runtime-core = { path = "../agent-vitals-runtime-core" }
rusqlite = { version = "0.31", features = ["bundled"] }
jiff = "0.2"
serde = "1"
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
walkdir = "2"
# 自看护（REVIEW P4）唯一新增依赖：POSIX `getrusage`（`ingest::self_monitor`）
# 读自身累计 CPU 时间。用 POSIX 标准 API 而非 macOS 专属的 `proc_pidinfo`——
# 覆盖面更宽，且 `libc` 早已是 tauri 链下来的传递依赖，这里只是把它声明
# 成直接依赖，没有新拉一条依赖链。`#[cfg(unix)]` 门控，非 unix 平台读不到
# 就诚实返回 `None`，不编造。
libc = "0.2"
# `notify`：2026-09-22 产品拍板（P2_WATCHER_PRODUCT_REVIEW.md 方案 A）后解除禁令，但只在
# `watcher` feature 下引入（desktop 经 runtime 门面启用）——默认构建（CLI / wasm）零该依赖。
notify = { version = "6.1", optional = true }

[dev-dependencies]
agent-vitals-domain = { path = "../agent-vitals-domain" }
rusqlite = { version = "0.31", features = ["bundled"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"

