[package]
name = "vitals-core"
version = "0.5.0"
edition = "2021"
rust-version = "1.74"
description = "Harness-agnostic behavioral audit runtime: Canonical Event -> Trajectory -> Detector -> Evidence-backed Finding -> Deterministic Replay"
repository = "https://github.com/Oh-Agent-AI/oh-agent"
license = "MIT"

[lib]
name = "vitals_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
# preserve_order：CanonicalEvent.attributes / Trajectory.attributes 是自由
# JSON object，键序必须与输入一致才能做 §15.3 的字节级 serde round-trip 断言
# 和未来（M1）的 canonical JSON 比较——同 agent-vitals-domain 的理由。
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "1"
# M1：§10.3 Finding fingerprint 与 §11.2 input fingerprint 都要求确定性哈希
# （§5.3 依赖预算）。canonical.rs 是唯一调用点。
sha2 = "0.10"
