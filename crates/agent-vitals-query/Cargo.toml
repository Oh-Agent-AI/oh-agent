[package]
name = "agent-vitals-query"
version = "1.4.0"
edition = "2021"
rust-version = "1.74"
description = "Agent Vitals read side (layers L2-L3): source configuration, session shims, SQL summary repository, trace, export"
repository = "https://github.com/Oh-Agent-AI/oh-agent"
license = "MIT"

# W3 第 4 步：从 agent-vitals-runtime 拆出。只能依赖 runtime-core（地基层）与
# data / domain / harnesses；Cargo 保证它不可能反向依赖 billing / ingest / trust / mcp。

[lib]
name = "agent_vitals_query"
path = "src/lib.rs"

[dependencies]
agent-vitals-runtime-core = { path = "../agent-vitals-runtime-core" }
agent-vitals-data = { path = "../agent-vitals-data" }
agent-vitals-domain = { path = "../agent-vitals-domain" }
agent-vitals-harnesses = { path = "../agent-vitals-harnesses", features = ["sources"] }
rusqlite = { version = "0.31", features = ["bundled"] }
jiff = "0.2"
serde = "1"
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
sha2 = "0.10"
walkdir = "2"

[dev-dependencies]
rusqlite = { version = "0.31", features = ["bundled", "trace"] }
# 两个端到端测试（summary 插件宿主、export 种子）要走真实 ingest 写入再读——
# ingest 在本 crate 之上（agent-vitals-ingest），dev-dependency 成环是 Cargo 允许的：跨边界的只有 data 层
# 类型（AuthorityDb），ENV_LOCK 在 runtime-core，不会出现同一 crate 两份类型。
agent-vitals-ingest = { path = "../agent-vitals-ingest" }
