[package]
name = "agent-vitals-data"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Durable evidence + queryable projection layer for Agent Vitals (v0.9 Data Foundation)"
repository = "https://github.com/Oh-Agent-AI/oh-agent"
license = "MIT"

[lib]
name = "agent_vitals_data"
path = "src/lib.rs"

# v0.9 Stage B：依赖 = domain（纯 DTO 契约）+ serde_json（facts 机制）+
# rusqlite（可重建查询索引，spec §5.1 的计划内引入）。仍然**不接**
# agent-vitals-harnesses / runtime / 二进制——依赖方向单向（runtime → data →
# domain；harnesses 与 data 平行、互不依赖），`tests/dependency_budget.rs`
# 钉住这条边界。rusqlite 用 bundled（与 harnesses/cli 同版本 0.31，不新增
# sqlite3 二进制面）；不引 ORM（spec §5.1 明令）。
[dependencies]
agent-vitals-domain = { path = "../agent-vitals-domain" }
jiff = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.31", features = ["bundled", "hooks"] }

# `hooks` feature 用 `Connection::authorizer(...)`（增量 7.5 `query_sql_readonly`
# 的作者回调）。`bundled` 自带 modern_sqlite 满足 SQLite authorizer 的
# SQLITE_DENY/SQLITE_OK 路径——0.31 默认导出。

[dev-dependencies]
agent-vitals-domain = { path = "../agent-vitals-domain" }
