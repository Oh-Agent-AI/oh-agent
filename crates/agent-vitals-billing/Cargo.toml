[package]
name = "agent-vitals-billing"
version = "1.4.0"
edition = "2021"
rust-version = "1.74"
description = "Agent Vitals runtime layer: billing (W3 split)"
repository = "https://github.com/Oh-Agent-AI/oh-agent"
license = "MIT"

[lib]
name = "agent_vitals_billing"
path = "src/lib.rs"

[dependencies]
agent-vitals-query = { path = "../agent-vitals-query" }
agent-vitals-data = { path = "../agent-vitals-data" }
agent-vitals-domain = { path = "../agent-vitals-domain" }
agent-vitals-harnesses = { path = "../agent-vitals-harnesses", features = ["sources"] }
agent-vitals-provider = { path = "../agent-vitals-provider" }
rusqlite = { version = "0.31", features = ["bundled"] }
jiff = "0.2"
serde = "1"
serde_json = { version = "1", features = ["preserve_order"] }
