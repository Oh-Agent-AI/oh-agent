[package]
name = "agent-vitals-trust"
version = "1.4.0"
edition = "2021"
rust-version = "1.74"
description = "Agent Vitals runtime layer: trust (W3 split)"
repository = "https://github.com/Oh-Agent-AI/oh-agent"
license = "MIT"

[lib]
name = "agent_vitals_trust"
path = "src/lib.rs"

[dependencies]
agent-vitals-query = { path = "../agent-vitals-query" }
agent-vitals-data = { path = "../agent-vitals-data" }
agent-vitals-domain = { path = "../agent-vitals-domain" }
agent-vitals-harnesses = { path = "../agent-vitals-harnesses", features = ["sources"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
walkdir = "2"
