[package]
name = "agent-vitals-wasm"
version = "1.4.0"
edition = "2021"
rust-version = "1.74"
description = "Browser wasm build of agent-vitals: pure behavior audit over in-memory events"
repository = "https://github.com/Oh-Agent-AI/oh-agent"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
agent-vitals-domain = { path = "../agent-vitals-domain" }
# Phase D1：DSH wire 解析（`audit`/`compaction`/`waste`）迁进 harnesses 的
# `harnesses/dsh/sessions/`——wasm 的 `audit_events` / `compaction_events` /
# `detect_structural_waste` 现在从这里取。`default-features = false` →
# 不链 `sources` feature（`ruzstd` 等 I/O 依赖编不进 wasm32，§4.0）。
agent-vitals-harnesses = { path = "../agent-vitals-harnesses", default-features = false }
wasm-bindgen = "0.2"
# preserve_order 与 domain 同一理由：findings 键序必须与 CLI 逐字节一致。
serde_json = { version = "1", features = ["preserve_order"] }

# wasm-opt 需要下载 binaryen（网络依赖），跳过它——release 编译已做优化，
# 产物略大但功能等价，也去掉一次对外下载。
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
