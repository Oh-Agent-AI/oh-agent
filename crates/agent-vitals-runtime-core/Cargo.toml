[package]
name = "agent-vitals-runtime-core"
version = "1.4.0"
edition = "2021"
rust-version = "1.74"
description = "Agent Vitals runtime foundation (layers L0-L1): HomeResolver, clock, lease, state, pricing cards, tool envelope, event outbox, skills scanner"
repository = "https://github.com/Oh-Agent-AI/oh-agent"
license = "MIT"

# W3（docs/ARCHITECTURE_OPTIMIZATION_GUIDE.md）：从 agent-vitals-runtime 拆出的
# 最底层。本 crate 只能被 runtime 家族依赖，自身不认识 query / billing / ingest /
# trust / mcp——`agent-vitals-runtime/tests/module_layering.rs` 钉模块层级，
# Cargo 本身钉 crate 方向（本 crate 不可能 `use agent_vitals_runtime`）。

[lib]
name = "agent_vitals_runtime_core"
path = "src/lib.rs"

[dependencies]
agent-vitals-data = { path = "../agent-vitals-data" }
agent-vitals-domain = { path = "../agent-vitals-domain" }
agent-vitals-harnesses = { path = "../agent-vitals-harnesses", features = ["sources"] }
rusqlite = { version = "0.31", features = ["bundled"] }
jiff = "0.2"
serde = "1"
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
sha2 = "0.10"
walkdir = "2"
