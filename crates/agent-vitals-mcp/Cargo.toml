[package]
name = "agent-vitals-mcp"
version = "1.4.0"
edition = "2021"
rust-version = "1.74"
description = "Agent Vitals runtime layer: mcp (W3 split)"
repository = "https://github.com/Oh-Agent-AI/oh-agent"
license = "MIT"

[lib]
name = "agent_vitals_mcp"
path = "src/lib.rs"

[features]
# 内部 MCP 工具门控（`query_sql_readonly` / `billing_workflow` / `authority_audit`）。公开构建
# 不含这些工具——spec §8.2 / M0 D4 的承诺。runtime 门面的同名 feature 转发到这里。
mcp-internal = []

[dependencies]
agent-vitals-ingest = { path = "../agent-vitals-ingest" }
agent-vitals-trust = { path = "../agent-vitals-trust" }
agent-vitals-data = { path = "../agent-vitals-data" }
agent-vitals-domain = { path = "../agent-vitals-domain" }
agent-vitals-harnesses = { path = "../agent-vitals-harnesses", features = ["sources"] }
rusqlite = { version = "0.31", features = ["bundled"] }
jiff = "0.2"
serde = "1"
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
