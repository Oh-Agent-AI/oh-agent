[package]
name = "agent-vitals"
version = "1.4.0"
edition = "2021"
rust-version = "1.74"
description = "Health check for the Agent Skills installed on your machine"
repository = "https://github.com/Oh-Agent-AI/oh-agent"
license = "MIT"

[[bin]]
name = "agent-vitals"
path = "src/main.rs"

[dependencies]
agent-vitals-harnesses = { path = "../../crates/agent-vitals-harnesses", features = ["sources"] }
agent-vitals-domain = { path = "../../crates/agent-vitals-domain" }
# v0.9 Stage 0.5：`data` 子命令经 `SummaryRepository` trait（data crate 定义）
# 调 runtime 的 `JsonSummaryRepository`——CLI 拿 trait 对象，不 new 具体类型
# （spec §3.1 依赖表：apps 只消费 Runtime/Data 的版本化 DTO）。
agent-vitals-data = { path = "../../crates/agent-vitals-data" }
agent-vitals-runtime = { path = "../../crates/agent-vitals-runtime" }
# V17 探针面 runner（WORKBENCH_TEST_TAB_SPEC §6）：L0 身份探针 + consent/预算。
agent-vitals-probe = { path = "../../crates/agent-vitals-probe" }
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
# preserve_order 不是可选项：Python 的 dict 保持插入顺序，serde_json 的 Map
# 默认按 key 重排。少了它，输出 diff 不可读、快照对比全是噪声，golden 也对不上。
# —— ENGINEERING §3 第 4 条
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
walkdir = "2"
# v0.8 Phase D4：DSH 会话 `.zstd` 多帧解压（`ruzstd`）迁进
# `agent-vitals-harnesses` 的 `sources` feature——二进制经 `features = ["sources"]`
# 传递拿到，不再直接依赖。
# WorkBuddy 会话审计的 sqlite 读取（`~/.workbuddy/workbuddy.db`）。仓库第一个 sqlite
# reader；`bundled` 特性自带 sqlite3.c，不依赖系统 sqlite。「宿内 skill 零第三方库」
# 同样只管分发的 Python skill——Python 侧用 stdlib `sqlite3`，Rust 二进制加 rusqlite
# 不违反它（ruzstd 同款决策）。core crate 保持纯净，I/O 只在这里。
rusqlite = { version = "0.31", features = ["bundled"] }

# Data MCP 内部工具（`authority_audit` / `query_sql_readonly`，spec §8）。
# 公开构建（默认 feature = []）不含这些工具——spec §8.2 / M0 D4 的承诺。
# 调试 Agent 用 `cargo run --features mcp-internal -- data-mcp serve` 启用。
[features]
mcp-internal = ["agent-vitals-runtime/mcp-internal"]

# 仅开发期依赖，**不进二进制**。与 Python 侧的 hypothesis 同一性质：
# 仓库的「零依赖」约束针对的是被分发的扫描器，不是测试工具。
[dev-dependencies]
proptest = "1"
