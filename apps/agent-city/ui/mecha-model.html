<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent City · 机甲与怪兽模型</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%}body{background:#07131e;color:#e8f1f8;font:15px system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}canvas{display:block;width:100%;height:100%}header{position:absolute;top:30px;left:36px;pointer-events:none;max-width:560px}header small{letter-spacing:.18em;color:#79a7c4;font-size:11px}h1{margin:9px 0 7px;font-size:32px;font-weight:560;letter-spacing:.02em}header p{margin:0;color:#8faec2;font-size:14px}main{position:absolute;inset:0}aside{position:absolute;left:24px;right:24px;bottom:22px;display:flex;gap:14px 20px;align-items:end;flex-wrap:wrap;padding:14px 18px;border:1px solid #ffffff1f;border-radius:14px;background:#0b1a27e8;box-shadow:0 18px 50px #0006;backdrop-filter:blur(10px)}label{display:grid;gap:5px;font-size:12px;color:#8faec2}select,button{min-height:40px;padding:7px 13px;border:1px solid #315066;border-radius:8px;background:#102638;color:#e8f1f8;font:inherit}select:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #3fd6a0;outline-offset:2px}button{cursor:pointer}button:hover{background:#16344a}.check{display:flex;align-items:center;gap:7px;min-height:40px;padding:0 4px;color:#cfe2ee;font-size:13px}input[type=checkbox]{width:18px;height:18px;accent-color:#3fd6a0}output{margin-left:auto;align-self:center;color:#9fc3d6;font-size:12px;line-height:1.6;font-variant-numeric:tabular-nums;text-align:right}#scale{position:absolute;left:36px;bottom:112px;color:#8faec2;font-size:12px;display:flex;align-items:center;gap:8px;pointer-events:none}#scale i{display:block;width:26px;height:10px;border:1px solid #3fd6a0aa;background:#3fd6a022}@media(max-width:760px){header{left:20px;top:18px;max-width:calc(100% - 40px)}h1{font-size:24px}#scale{left:20px;bottom:196px}aside{left:10px;right:10px;bottom:10px;gap:10px;padding:12px}output{width:100%;text-align:left;margin-left:0}}
</style></head><body>
<header><small>AGENT CITY / MECHA BAY / MODEL REVIEW</small><h1>机甲与怪兽</h1><p>单个模型检查 · 1 格 = 16 m · 拖动旋转 / 滚轮缩放</p></header>
<main id="stage" aria-label="机甲与怪兽三维模型，可拖动旋转和滚轮缩放"></main>
<div id="scale"><i></i>脚下亮框 = 一个战场格（16 × 16 m）</div>
<aside aria-label="模型预览控制">
  <label>模型<select id="model"></select></label>
  <label>视角<select id="view"><option value="hero">三分之四</option><option value="front">正面</option><option value="side">侧面</option><option value="rear">背面</option><option value="top">俯视</option></select></label>
  <label>动作<select id="action"><option value="idle">待机</option><option value="move">移动</option><option value="attack">攻击</option><option value="repair">维修</option><option value="hit">受击</option><option value="defeat">倒地</option></select></label>
  <label>动作进度<input id="progress" type="range" min="0" max="100" step="1" value="0"></label>
  <label class="check"><input id="animate" type="checkbox" checked>播放动作</label>
  <label class="check"><input id="loop" type="checkbox" checked>循环</label>
  <button id="replay" type="button">重播动作</button>
  <label class="check"><input id="spin" type="checkbox">自动旋转</label>
  <button id="reframe" type="button">重新取景</button>
  <output id="stats" aria-live="polite"></output>
</aside>
<script type="module" src="/src/dev/mechaModelPreview.ts"></script>
</body></html>
