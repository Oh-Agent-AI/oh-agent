<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent City · 玩家车模型</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9e6de;color:#263834;font:15px system-ui,sans-serif}canvas{display:block;width:100%;height:100%}header{position:absolute;top:30px;left:36px;pointer-events:none}header small{letter-spacing:.16em;color:#64776e}h1{margin:8px 0;font-size:30px;font-weight:550}header p{color:#64776e}main{height:100vh;min-height:560px}aside{position:absolute;bottom:24px;left:24px;right:24px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;padding:16px 20px;background:#ffffffeb;border:1px solid #d4d8cf;border-radius:14px}button,select,input{font:inherit;accent-color:#326754}button,select{min-height:44px;padding:8px 16px;background:#f7f8f4;border:1px solid #c8d0c5;border-radius:8px;color:inherit}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #326754;outline-offset:3px}label{display:flex;align-items:center;gap:8px}output{color:#60756b;font-size:13px;margin-left:auto} body.night header{color:#e3ebe2}body.night header small,body.night header p{color:#afc0b4} @media(max-width:700px){header{left:20px;top:16px}h1{font-size:24px}aside{gap:8px;bottom:10px;left:10px;right:10px}output{display:none}}
</style></head><body><header><small>AGENT CITY / CORAL COAST / ROADSTER 01</small><h1>海风、日落，还有敞篷</h1><p>CORAL COAST · 珊瑚粉复古跑车 · 米白双座</p></header><main id="stage" aria-label="玩家汽车三维模型，可拖动旋转和滚轮缩放"></main><aside aria-label="模型预览控制"><label>视角<select id="view"><option value="hero">三分之四</option><option value="front">车头</option><option value="side">侧面</option><option value="rear">车尾 / 跟车</option></select></label><label>转向<input id="steering" type="range" min="-0.55" max="0.55" step="0.01" value="0"></label><button id="rolling" aria-pressed="false">播放车轮</button><label><input id="brake" type="checkbox">刹车灯</label><label><input id="reverse" type="checkbox">倒车</label><label><input id="night" type="checkbox">夜间</label><a href="/driving.html" style="color:#326754;padding:12px">开始试驾 →</a><output id="stats"></output></aside><script type="module" src="/src/dev/carModelPreview.ts"></script></body></html>
