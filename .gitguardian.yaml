version: 2

# agent-vitals is a security scanner: its own source contains the *names* of the
# rules it looks for in other skills (e.g. the string "HARDCODED_SECRET" in
# doctor.py's SECURITY_CODES table). GitGuardian's generic-password detector
# matches those rule-code strings as if they were literal secrets — the same
# self-referential false positive scan.py's own security_scan() already guards
# against for SELF_SKILL_ROOT (see doctor.py, security.py). There is no actual
# credential in this file; only exclude the specific files where rule-code
# tables live, not the whole tree.
secret:
  ignored-paths:
    - "packages/agent-vitals-python/agent_vitals/skills/doctor.py"
    - "apps/cli/src/skills/doctor.rs"
