<!--
================================================================================
  Agent Vitals · 单文件 HTML 日历模板（M4 产出）
================================================================================

  这是 agent-vitals 时间线的可视化层。它**不**重新定义数据 schema——它只
  把 state.py 已经写好的 today.json / month.json 渲染成一张热力图。**单一
  真相源是 `scripts/agent_vitals/state.py`**，本模板对其 schema 是「只读、
  只渲染、发现不符就报错」。任何字段含义的改动必须先回到 state.py 与
  crates/agent-vitals-domain/，再回这里同步；反过来用本模板去「教」state.py
  怎么写 schema 是方向性错误。

  ── 与 state.py 的 schema 对应 ──────────────────────────────────────────────

    today.json                          月度视图
    ┌──────────────────────────┐        ┌──────────────────────────┐
    │ schema_version: "1.0.0"  │        │ schema_version: "1.0.0"  │
    │ generated_at: ISO8601 UTC│        │ generated_at: ISO8601 UTC│
    │ date: "YYYY-MM-DD" (BJ)  │        │ month: "YYYY-MM"         │
    │ buckets: {               │        │ days: {                  │
    │   "0":  {8 字段},        │        │   "2026-08-01": {8 字段},│
    │   "14": {8 字段},        │        │   "2026-08-02": {8 字段},│
    │   ...                    │        │   ...                    │
    │ }                        │        │ }                        │
    └──────────────────────────┘        └──────────────────────────┘

    8 字段 = 4 基础桶 + 4 peak_*：
      uncached_input_tokens           peak_uncached_input_tokens
      output_tokens                   peak_output_tokens
      cache_read_tokens               peak_cache_read_tokens
      cache_write_tokens              peak_cache_write_tokens

    peak_* 是「其中发生在高峰时段的份额」（cost.py 的 _price 用它们做 peak/
    off-peak 分价），不是另一个独立的桶。本模板的「peak 时段边框」就是基于
    「任一 peak_* > 0」来标。

  ── inline 策略（CLAUDE.md 的「no network · no upload」）──────────────────

    所有 CSS / JS 都内联在本文件里。无 <link rel="stylesheet">、无
    <script src=...>、无 @font-face。无 npm install，无 webpack。唯一外部
    资源是用户本地文件系统上的 JSON（state.py 写出的 state/*.json）。这与
    CLAUDE.md 的「no telemetry · no upload · no network」一致——浏览器只
    读本地状态文件，不发任何请求。

  ── 数据获取路径 ──────────────────────────────────────────────────────────

    1. URL ?file=today 或 ?file=month 决定读哪个 JSON；没有 ?file= 时用
       `calendar --source` 注入的 `window.AGENT_VITALS_DEFAULT_MODE`
       （不注入则兜底 "today"）——两个 tab 各自的内联数据都在文件里
       （`calendar --output` 会把 today.json / month.json 都塞进去，
       只要那份 state 文件在磁盘上存在），所以点哪个 tab 都能看到
       真实数据，不是只有 --source 选中的那个能看。
    2. 路径默认硬编码到 STATE_HOME_DEFAULT；测试/调试用
       `window.AGENT_VITALS_STATE_HOME = '/custom/path'` 覆盖。
    3. fetch() 在浏览器里**几乎一定**被 CORS 拒（开 http.server 也不能跨
       主机读 ~/.agent-vitals/），所以 fallback 是 <input type="file"> 让
       用户手动选 JSON。这是设计而非补丁——state.py 写出的数据本就在用户
       主目录，浏览器拿不到是预期行为。

  ── 与 Rust / Python 三向锁步 ─────────────────────────────────────────────

    cost 公式硬编码了 deepseek-v4-flash 的 peak/off-peak 价（1.5/3.0/4.5/9.0
    元/百万 token + 0.05/0.10 缓存命中 + 0 缓存写入），与 state.py 不矛盾——
    state.py 只折叠 token 数不算价。**这是 fallback 近似,不是权威路径**：
    `_render_calendar_html`（cli.py）在内联数据时,会用真正的
    `cost.py::cost_report` 给带 `by_model` 字段的桶/日子（见 state.py 的
    `merge_today`/`merge_month`）精算一份 `cost`/`accurate_cost` 一并塞进
    JSON——JS 这份硬编码公式只在那个字段不存在时（这个功能上线前的旧
    数据）才会被用到。若价目表（pricing.json）改了，精算路径自动跟着走；
    只有这份 fallback 公式需要手动同步（与
    scripts/agent_vitals/cost.py::_price + crates/agent-vitals-domain/src/domain/cost/mod.rs
    + dsh-client/src/harness/index.ts::costReportFrom 平行）。
    tests/test_pricing_lockstep.py 守价目表源头一致性，fallback 副本目前没
    自动测——这是已知的单点，接受它只是「大致近似」。

  ── 不用脚本渲染 ──────────────────────────────────────────────────────────

    故意不用任何 JS 框架（React / Vue 都不引）：单文件 200 行内能写完的事，
    引入框架是负 ROI。读者打开 HTML 直接看 render 函数就够了。
================================================================================
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agent Vitals · 日历视图（M4）</title>
  <style>
    /* ── 设计 token ────────────────────────────────────────────────────
     * 配色按「不抢戏」的暗色基调——日历是观察面板，不是营销页。
     * 不引字体：只靠系统字栈（macOS = SF Pro，Win = Segoe UI），与
     * 其他 agent-vitals 报告保持一致。CSS 变量集中在这里方便后续换
     * 主题，但本仓库现阶段只发单主题。
     */
    :root {
      --bg: #0e1117;
      --surface: #161b22;
      --surface-2: #1c2128;
      --border: #30363d;
      --border-strong: #484f58;
      --fg: #e6edf3;
      --fg-muted: #8b949e;
      --fg-dim: #6e7681;
      --accent: #58a6ff;
      --accent-soft: rgba(88, 166, 255, 0.12);
      --warn: #d29922;
      --warn-soft: rgba(210, 153, 34, 0.18);
      --peak: #db6d28;
      --peak-soft: rgba(219, 109, 40, 0.20);
      --unpriced: #db6d28;
      --unpriced-soft: rgba(219, 109, 40, 0.18);
      --good: #3fb950;
      --r: 8px;
      --r-sm: 4px;
      --s1: 4px;
      --s2: 8px;
      --s3: 12px;
      --s4: 16px;
      --s5: 24px;
      --s6: 32px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
              "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei",
              sans-serif;
      --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
              "Liberation Mono", monospace;
    }

    * { box-sizing: border-box; }

    /* body 用 100% min-height 让 footer 永远贴底——avoid scroll-on-empty */
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); }
    body { font: 14px/1.5 var(--font); min-height: 100vh; }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    button, input, select { font: inherit; color: inherit; }

    .shell {
      max-width: 1480px;
      margin: 0 auto;
      padding: var(--s5) clamp(16px, 3vw, 40px) var(--s6);
    }

    /* ── 顶栏 ──────────────────────────────────────────────────────── */
    header.topbar {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: var(--s4); margin-bottom: var(--s5); flex-wrap: wrap;
    }
    .title-block h1 {
      font-size: 22px; font-weight: 600; letter-spacing: -0.02em;
      margin: 0 0 4px;
    }
    .title-block .sub {
      color: var(--fg-muted); font-size: 13px;
    }
    .title-block .sub code {
      font: 12px/1 var(--mono); background: var(--surface-2);
      padding: 2px 6px; border-radius: var(--r-sm); color: var(--accent);
    }

    /* today / month 切换用分段控件——比下拉轻，不抢屏 */
    .mode-switch {
      display: inline-flex; gap: 2px; padding: 3px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px;
    }
    .mode-switch a {
      padding: 6px 14px; border-radius: 6px;
      color: var(--fg-muted); font-size: 13px; font-weight: 500;
    }
    .mode-switch a:hover { color: var(--fg); text-decoration: none; }
    .mode-switch a.active {
      background: var(--accent-soft); color: var(--accent);
    }

    /* ── summary 卡片（今日/本月 总额） ────────────────────────────── */
    .summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: var(--s3); margin-bottom: var(--s5);
    }
    .summary .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--r); padding: var(--s4);
    }
    .summary .card .label {
      font-size: 12px; color: var(--fg-muted);
      margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.04em;
    }
    .summary .card .value {
      font: 600 22px/1.2 var(--mono); color: var(--fg);
    }
    .summary .card .value.small { font-size: 18px; }
    .summary .card .note {
      margin-top: 6px; font-size: 12px; color: var(--fg-dim);
    }
    .summary .card .note .peak-tag {
      color: var(--peak); font-weight: 500;
    }

    /* ── 跨执行环境今日总览（统一范式：今日所有 Agent 总花费 + 每执行环境 mini 卡）── */
    #overview { margin-bottom: var(--s5); }
    .overview-head {
      display: flex; align-items: baseline; justify-content: space-between;
      gap: var(--s3); margin-bottom: var(--s3); flex-wrap: wrap;
    }
    .overview-title { font: 600 16px var(--font); }
    .overview-sub { color: var(--fg-muted); font-size: 12px; }
    /* mini 卡是 <a>——卡片视觉要覆盖掉全局 a 的 accent 色，hover 描边提示可点 */
    #overview-cards a.card {
      color: var(--fg); text-decoration: none; display: block;
      transition: border-color 0.12s ease;
    }
    #overview-cards a.card:hover { border-color: var(--accent); }

    /* ── 日历容器 ─────────────────────────────────────────────────── */
    .panel {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--r); padding: var(--s5);
    }
    .panel + .panel { margin-top: var(--s4); }
    .panel-head {
      display: flex; align-items: baseline; justify-content: space-between;
      gap: var(--s4); margin-bottom: var(--s4); flex-wrap: wrap;
    }
    .panel-title { margin: 0; font-size: 16px; font-weight: 600; }
    .panel-sub { color: var(--fg-muted); font-size: 12px; }

    /* ── today：24 单元格 ─────────────────────────────────────────── */
    /*
     * 24 个等宽单元用 grid 一行排开——窗口宽度足够时整齐；不够时整列变窄
     * 但**绝不**换行成多行（连续性比完整可见重要；观察「时间分布」要求
     * 用户水平扫视能直接对到某个小时）。
     */
    .today-grid {
      display: grid;
      grid-template-columns: 36px repeat(24, minmax(0, 1fr));
      gap: 2px; align-items: stretch;
    }
    .today-axis {
      grid-column: 1; font: 11px var(--mono); color: var(--fg-dim);
      align-self: end; padding-bottom: 4px; text-align: right;
    }
    .hour-label {
      grid-row: 2; font: 10px var(--mono); color: var(--fg-dim);
      text-align: center; padding-top: 4px;
    }
    .hour-label.heavy { color: var(--fg-muted); font-weight: 600; }
    .hour-cell {
      grid-row: 1; height: 80px; border-radius: var(--r-sm);
      background: var(--surface-2); border: 1px solid transparent;
      position: relative; cursor: default;
      transition: transform 0.12s ease, border-color 0.12s ease;
      display: flex; flex-direction: column; justify-content: flex-end;
      padding: 4px 6px;
      font: 11px var(--mono); color: var(--fg);
    }
    .hour-cell:hover {
      transform: translateY(-1px);
      border-color: var(--accent);
      z-index: 2;
    }
    .hour-cell.empty { background: var(--surface); border: 1px dashed var(--border); }
    /* peak 时段标记——边框而非填色，因为色块已被 token 量决定，再叠色反而
     * 抢焦点。边框用 peak 橙，与「peak 时段」语义一致。 */
    .hour-cell.peak {
      border: 2px solid var(--peak);
      box-shadow: inset 0 0 0 1px var(--peak-soft);
    }
    .hour-cell .amt {
      font-size: 11px; line-height: 1.2; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
    }
    .hour-cell .hour-tag {
      font-size: 9px; color: var(--fg-dim); line-height: 1;
      margin-bottom: 2px;
    }
    .hour-cell.peak .hour-tag { color: var(--peak); }

    /* ── month：7×N 日历网格 ─────────────────────────────────────── */
    /*
     * 日历列固定 7。行数动态：6 行够装所有「1 号是周五」+「31 号」组合。
     * 留白格用 .cell-empty——区别于 .day-cell 的「真实数据」状态。
     */
    .month-head {
      display: grid; grid-template-columns: repeat(7, 1fr);
      gap: 4px; margin-bottom: 6px;
    }
    .month-head > div {
      font-size: 11px; color: var(--fg-muted); text-align: center;
      padding: 6px 0; text-transform: uppercase; letter-spacing: 0.04em;
    }
    .month-grid {
      display: grid; grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }
    .day-cell {
      min-height: 88px; background: var(--surface-2);
      border: 1px solid transparent; border-radius: var(--r-sm);
      padding: 7px 9px; cursor: default;
      display: flex; flex-direction: column; justify-content: space-between;
      transition: transform 0.12s ease, border-color 0.12s ease;
    }
    .day-cell:hover {
      transform: translateY(-1px);
      border-color: var(--accent); z-index: 2;
    }
    /* 空格子：实心 dim 背景，比虚线更干净；月份首尾的「补位」用半透明 */
    .day-cell.empty {
      background: rgba(22, 27, 34, 0.3); border: 1px solid transparent;
      opacity: 0.5; cursor: default;
    }
    .day-cell.empty:hover { transform: none; border-color: transparent; }
    .day-cell .num {
      font: 700 15px var(--mono); color: var(--fg);
      display: flex; align-items: center; gap: 4px;
    }
    .day-cell.empty .num { color: var(--fg-dim); font-weight: 400; }
    .day-cell .num .peak-dot {
      display: inline-block; width: 7px; height: 7px;
      background: var(--peak); border-radius: 50%;
      box-shadow: 0 0 6px rgba(219, 109, 40, 0.6);
    }
    .day-cell .amt {
      font: 500 12px var(--mono); color: var(--fg-muted);
      margin-top: 4px; line-height: 1.25;
      letter-spacing: -0.01em;
    }
    .day-cell .amt .cost {
      color: var(--accent); margin-top: 3px;
      font-weight: 600; font-size: 13px;
      letter-spacing: 0;
    }
    .day-cell.today {
      border: 1.5px solid var(--accent);
      box-shadow: 0 0 0 1px rgba(56, 139, 253, 0.2);
    }

    /* ── tooltip：hover 显示明细 ──────────────────────────────────── */
    /*
     * tooltip 用 position:fixed 跟着鼠标，避免被父容器 overflow 切掉。
     * 不引第三方库；用 data-* 属性挂明细，CSS 控制可见性。
     */
    #tip {
      position: fixed; pointer-events: none;
      background: #0b0f15; border: 1px solid var(--border-strong);
      border-radius: var(--r); padding: 10px 12px;
      font: 12px var(--mono); color: var(--fg);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      max-width: 320px; opacity: 0; transition: opacity 0.08s ease;
      z-index: 100;
    }
    #tip.show { opacity: 1; }
    #tip .tip-title {
      font: 600 13px var(--font); margin-bottom: 6px;
      color: var(--accent);
    }
    #tip .row {
      display: flex; justify-content: space-between; gap: 12px;
      padding: 1px 0;
    }
    #tip .row .k { color: var(--fg-muted); }
    #tip .row .v { color: var(--fg); }
    #tip .row .v.peak-v { color: var(--peak); }
    #tip .sep {
      height: 1px; background: var(--border); margin: 6px 0;
    }
    #tip .total {
      font: 600 13px var(--mono); color: var(--accent);
    }

    /* ── fallback：file input ─────────────────────────────────────── */
    .file-fallback {
      margin-top: var(--s4); padding: var(--s5);
      background: var(--warn-soft);
      border: 1px solid var(--warn);
      border-radius: var(--r);
      display: flex; align-items: center; gap: var(--s4); flex-wrap: wrap;
    }
    .file-fallback .msg { flex: 1 1 auto; color: var(--fg); font-size: 13px; }
    .file-fallback label {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--accent); color: #0b0f15;
      padding: 8px 16px; border-radius: var(--r-sm);
      font-weight: 500; cursor: pointer;
    }
    .file-fallback label input { display: none; }
    .file-fallback label:hover { filter: brightness(0.95); }

    /* ── 状态/错误展示 ──────────────────────────────────────────── */
    #status {
      padding: var(--s3) var(--s4); border-radius: var(--r);
      background: var(--surface-2); border: 1px solid var(--border);
      color: var(--fg-muted); font-size: 13px;
      margin-bottom: var(--s4);
    }
    #status.err { border-color: var(--peak); color: var(--peak); }

    /* ── 响应式 ──────────────────────────────────────────────────── */
    @media (max-width: 720px) {
      .today-grid { grid-template-columns: 28px repeat(24, minmax(20px, 1fr)); }
      .hour-cell { height: 64px; padding: 2px 3px; }
      .hour-cell .amt { font-size: 10px; }
      .day-cell { min-height: 64px; padding: 4px; }
      .day-cell .amt { font-size: 10px; }
      #render-root.view-codex .day-cell { min-height: 44px; padding: 4px; }
      #render-root.view-codex .day-cell .amt { font-size: 10px; }
      #render-root.view-codex table.model-table { font-size: 12px; }
      #render-root.view-codex table.model-table th,
      #render-root.view-codex table.model-table td { padding: 6px; }
    }

    /* ── 执行环境 + 视图切换（统一范式：执行环境注册制）────────────────────── */
    /* harness-switch 复用 mode-switch 的分段控件视觉；两段叠成一列，执行环境在上、
     * 视图在下。DSH 是 0 号模板，Codex 是 1 号执行环境。 */
    .switch-stack {
      display: flex; flex-direction: column; align-items: flex-end; gap: 6px;
    }
    .harness-switch a.active {
      background: var(--accent-soft); color: var(--accent);
    }
    .panel-sub code {
      font: 12px/1 var(--mono); background: var(--surface-2);
      padding: 1px 5px; border-radius: var(--r-sm); color: var(--accent);
    }

    /* ── codex 执行环境面板（作用域在 #render-root.view-codex 下）────────── */
    /* 与 DSH 共用同款设计 token 与 .panel/.day-cell/#tip，但网格密度不同
     * （codex 日格 56px vs DSH 88px）、且要多一套 model-table/quota 样式。
     * 用执行环境作用域类隔离，不污染 DSH 视图。 */
    #render-root.view-codex table.model-table {
      width: 100%; min-width: 720px; border-collapse: collapse;
      font: 13px var(--mono);
    }
    #render-root.view-codex table.model-table th,
    #render-root.view-codex table.model-table td {
      padding: 8px 10px; text-align: right; white-space: nowrap;
      border-bottom: 1px solid var(--border);
    }
    #render-root.view-codex table.model-table th {
      font: 11px var(--font); color: var(--fg-muted); font-weight: 500;
      text-transform: uppercase; letter-spacing: 0.04em;
    }
    #render-root.view-codex table.model-table th:first-child,
    #render-root.view-codex table.model-table td:first-child { text-align: left; }
    #render-root.view-codex table.model-table tbody tr:hover {
      background: rgba(88, 166, 255, 0.06);
    }
    #render-root.view-codex table.model-table td.model { font-weight: 600; color: var(--fg); }
    #render-root.view-codex table.model-table td.speed { color: var(--fg-muted); font-size: 12px; }
    #render-root.view-codex table.model-table td.cost { color: var(--accent); font-weight: 600; }
    #render-root.view-codex table.model-table td.unpriced { color: var(--unpriced); font-weight: 600; }
    #render-root.view-codex table.model-table tfoot td {
      border-top: 2px solid var(--border-strong); font-weight: 600;
    }
    #render-root.view-codex .model-table-root { overflow-x: auto; }

    #render-root.view-codex .heat-wrap { overflow-x: auto; }
    #render-root.view-codex .wrow {
      display: grid; grid-template-columns: repeat(7, 1fr);
      gap: 4px; margin-bottom: 4px;
    }
    #render-root.view-codex .weekday-head { margin-top: var(--s3); margin-bottom: 6px; }
    #render-root.view-codex .weekday-head > div {
      font-size: 11px; color: var(--fg-muted); text-align: center;
      padding: 6px 0; text-transform: uppercase; letter-spacing: 0.04em;
    }
    #render-root.view-codex .month-title {
      font: 600 13px var(--mono); color: var(--fg-muted);
      margin: var(--s3) 0 8px;
    }
    #render-root.view-codex .month-title:first-child { margin-top: 0; }
    /* codex 日格更紧凑（56px vs DSH 88px）+ today「今」徽标 */
    #render-root.view-codex .day-cell {
      min-height: 56px; padding: 6px 8px;
    }
    #render-root.view-codex .day-cell { position: relative; }
    /* codex today 小时条复用共享 .today-grid/.hour-cell，但格子更紧凑（56px） */
    #render-root.view-codex .hour-cell { height: 56px; }
    #render-root.view-codex .day-cell .num { font-size: 13px; }
    #render-root.view-codex .day-cell .amt { font-size: 12px; }
    #render-root.view-codex .day-cell .amt .cost { font-size: 12px; }
    #render-root.view-codex .day-cell.today { border: 1px solid var(--accent); }
    #render-root.view-codex .day-cell.today .today-mark {
      position: absolute; top: 2px; right: 2px;
      font: 700 9px var(--mono); color: var(--bg); background: var(--accent);
      border-radius: 3px; padding: 1px 3px;
    }
    #render-root.view-codex .day-cell.pad { background: transparent; border: none; cursor: default; }
    #render-root.view-codex .day-cell.pad:hover { transform: none; border-color: transparent; }

    #render-root.view-codex .quota-row + .quota-row { margin-top: var(--s4); }
    #render-root.view-codex .quota-row .q-head {
      display: flex; justify-content: space-between; align-items: baseline;
      gap: var(--s3); margin-bottom: 6px; font: 13px var(--mono);
    }
    #render-root.view-codex .quota-row .q-label { color: var(--fg-muted); }
    #render-root.view-codex .quota-row .q-pct { font-weight: 600; }
    #render-root.view-codex .quota-bar {
      height: 10px; border-radius: 5px; background: var(--surface-2);
      border: 1px solid var(--border); overflow: hidden;
    }
    #render-root.view-codex .quota-bar .q-fill {
      height: 100%; border-radius: 4px;
      transition: width 0.3s ease, background-color 0.3s ease;
    }
    #render-root.view-codex .quota-row .q-reset {
      margin-top: 4px; font: 11px var(--mono); color: var(--fg-dim);
    }

    .warn-banner {
      margin-top: var(--s3); padding: var(--s3) var(--s4);
      background: var(--warn-soft); border: 1px solid var(--warn);
      border-radius: var(--r); color: var(--fg); font-size: 13px;
    }
    .unpriced-banner {
      margin-top: var(--s3); padding: var(--s3) var(--s4);
      background: var(--unpriced-soft); border: 1px solid var(--unpriced);
      border-radius: var(--r); color: var(--fg); font-size: 13px;
    }
    .banner-note { color: var(--fg-dim); font-size: 12px; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="shell">

    <header class="topbar">
      <div class="title-block">
        <h1 id="page-title">日历视图</h1>
        <div class="sub" id="sub-line">
          数据源 <code>~/.agent-vitals/state/</code>
          · schema <code>1.0.0</code>
        </div>
      </div>
      <div class="switch-stack">
        <nav class="mode-switch harness-switch" aria-label="切换执行环境">
          <a href="?harness=dsh" id="link-harness-dsh">DSH</a>
          <a href="?harness=codex" id="link-harness-codex">Codex</a>
        </nav>
        <nav class="mode-switch" id="mode-switch" aria-label="切换视图">
          <!-- 由 JS 按当前执行环境注入 -->
        </nav>
      </div>
    </header>

    <div id="status" role="status">读取 state 文件中……</div>

    <section id="overview" hidden>
      <div class="overview-head">
        <span class="overview-title">跨执行环境今日总览</span>
        <span class="overview-sub">今日总 token（币种无关求和）· 各币种花费（不编汇率）· 点卡片跳该执行环境 today</span>
      </div>
      <div class="summary" id="overview-cards">
        <!-- 由 JS 注入聚合卡 -->
      </div>
    </section>

    <section class="summary" id="summary" hidden>
      <!-- 由 JS 注入 card -->
    </section>

    <div id="render-root">
      <!-- 由 JS 注入 today-grid / month-grid / codex 面板 -->
    </div>

    <!--
      file fallback 永远展示——浏览器直接 fetch() 本地 JSON 99% 会因
      CORS 失败，与其先藏起来再动态展示，不如常驻占位 + 状态联动。
    -->
    <div class="file-fallback" id="file-fallback">
      <div class="msg">
        <b>浏览器无法直接读取本地 state 文件</b>（CORS 限制）。
        DSH 请选择 state.py 写出的 JSON 文件（<code>today.json</code> 或
        <code>month.json</code>）；Codex 请选择 <code>codex-cost --json</code>
        输出的报告：
      </div>
      <label>
        <input type="file" id="file-input" accept="application/json,.json" />
        选择 JSON 文件
      </label>
    </div>

  </div>

  <!-- tooltip 节点挂到 body 末尾，避免被父级 transform 拦截定位 -->
  <div id="tip" role="tooltip" aria-hidden="true"></div>

  <script>
  /* ============================================================================
   *  数据获取与渲染
   * ============================================================================
   *
   * 本文件只做一件事：把 state.py 写出的 JSON 渲染成热力图。**不在这里算权
   * 威 token 折叠**——折叠在 state.py/usage.py；**也不在这里算权威 cost**——
   * cost 在 cost.py（peak/off-peak 分价）。本脚本的 cost 公式是显示层副本：
   * 改了 pricing.json 必须同步改 _priceCompute()。
   *
   * 三段：fetch → render → tooltip。三段之间靠全局 state（mode, payload）
   * 串起来；不引入框架是故意的。
   */

  "use strict";

  // ─── 配置 ──────────────────────────────────────────────────────────────
  // macOS 用户的默认 home。Linux/Windows 用户请在 script 标签里覆盖：
  //   window.AGENT_VITALS_STATE_HOME = '/home/you/.agent-vitals/state';
  // 浏览器无法把 ~ 展开成 $HOME；硬编码是合理的——绝大多数用户在 macOS。
  var STATE_HOME_DEFAULT = "/Users/Admin/.agent-vitals/state";
  // 当前状态目录。bootstrap() 里按 window.AGENT_VITALS_STATE_HOME 覆盖——但覆盖
  // 前先声明默认值：文件是 strict mode，直接在 bootstrap 里给未声明变量赋值会抛
  // ReferenceError，整个加载流程断掉。声明 + 默认值让覆盖变成「改一个全局」。
  var HOME = STATE_HOME_DEFAULT;

  // peak/off-peak 单价（人民币元 / 百万 token）。
  // **来源**：scripts/agent_vitals/pricing.json providers.deepseek-official.models
  // .deepseek-v4-flash。**不是** deepseek-v4-pro——pro 是 4.5/13.5 + 0.15/0.30
  // 缓存命中。这里选 flash 的默认是因为 agent-vitals 默认模型是 flash；
  // 若要切 pro，改下面三行即可。缓存写一律 0（pricing.json 里写死 0）。
  var PRICE = {
    input_uncached_off:  1.5,
    input_uncached_peak: 3.0,
    input_cached_off:    0.05,
    input_cached_peak:   0.10,
    output_off:          4.5,
    output_peak:         9.0,
    cache_write:         0,
  };
  var M = 1e6; // token/百万token 换算系数——与 cost.py 第 117-122 行一致

  // ─── 工具函数 ──────────────────────────────────────────────────────────

  /**
   * 把一个 8 字段桶算成展示用数字。
   *
   * 不重命名/不重组字段——state.py 的 4 基础 + 4 peak 命名直接复用，保持
   * 「本模板只读 schema」的不变量。
   */
  function getFields(b) {
    return {
      inUnc: b.uncached_input_tokens   || 0,
      out:   b.output_tokens           || 0,
      cache: b.cache_read_tokens       || 0,
      write: b.cache_write_tokens      || 0,
      pIn:   b.peak_uncached_input_tokens || 0,
      pOut:  b.peak_output_tokens         || 0,
      pCac:  b.peak_cache_read_tokens     || 0,
      pWrt:  b.peak_cache_write_tokens    || 0,
    };
  }

  /** 总 token（4 基础桶加和，与 cost.py 的 u+c+o 等价；写 token 单价 0 不入费） */
  function totalTokens(b) {
    var f = getFields(b);
    return f.inUnc + f.out + f.cache + f.write;
  }

  /**
   * 桶/日子的 cost（元）。
   *
   * **优先用服务端精算的 `b.cost`**——`_render_calendar_html`（cli.py）
   * 内联数据时,对带 `by_model` 字段的日子已经用真正的 `cost.py::cost_
   * report` 按实际模型算过一遍价,直接读它就不会跟 `budget show`/xbar
   * 菜单栏的数字对不上。**只有 `b.cost` 不存在时**（这个功能上线前的
   * 旧数据,没有 by_model）才退回下面这份 deepseek-v4-flash 单价近似——
   * 那是「大致近似」，不是权威值，pro 模型的日子会被低估到 1/3，用户
   * 已经在别处（budget show/菜单栏）看得到精确数字了。
   */
  function costOf(b) {
    if (b.cost && typeof b.cost.total === "number") {
      var peak = b.cost.peak_total || 0;
      return { total: b.cost.total, peak: peak, off: b.cost.total - peak };
    }
    var f = getFields(b);
    var up = f.pIn / M, cp = f.pCac / M, op = f.pOut / M, wp = f.pWrt / M;
    var uo = (f.inUnc - f.pIn) / M;
    var co = (f.cache - f.pCac) / M;
    var oo = (f.out   - f.pOut) / M;
    var off  = uo * PRICE.input_uncached_off
             + co * PRICE.input_cached_off
             + oo * PRICE.output_off
             + wp * PRICE.cache_write;
    var peak = up * PRICE.input_uncached_peak
             + cp * PRICE.input_cached_peak
             + op * PRICE.output_peak;
    return { total: off + peak, peak: peak, off: off };
  }

  /** 判断一个桶是不是 peak 时段——任一 peak_* > 0 就算（peak 可重叠） */
  function isPeak(b) {
    var f = getFields(b);
    return (f.pIn + f.pOut + f.pCac + f.pWrt) > 0;
  }

  /** 数字千分位 */
  function n(n) {
    if (n === 0) return "0";
    return Math.round(n).toLocaleString("en-US");
  }

  /** 元金额（¥1.23） */
  function money(v) {
    if (v === 0) return "¥0.00";
    return "¥" + v.toFixed(2);
  }

  // ── codex 执行环境格式化（1 号执行环境私有；与 src/codex_cost.rs 的 format_number /
  //    format_usd 同 spec——JS 只格式化，不重算任何价）────────────────────
  var TOKEN_FIELDS = [
    "uncached_input_tokens", "output_tokens", "cached_input_tokens",
    "cache_write_input_tokens", "reasoning_output_tokens"
  ];

  function stripZeroFmt(s) {
    s = s.replace(/0+$/, "").replace(/\.$/, "");
    return s === "" ? "0" : s;
  }
  function formatNumber(n) {
    if (n >= 1e9) return stripZeroFmt((n / 1e9).toFixed(1)) + "B";
    if (n >= 1e6) return stripZeroFmt((n / 1e6).toFixed(1)) + "M";
    if (n >= 1e3) return stripZeroFmt((n / 1e3).toFixed(1)) + "K";
    return String(n);
  }
  function fmtUsd(v) {
    if (v === 0) return "$0";
    var s = (v >= 100) ? v.toFixed(1) : v.toFixed(2);
    return "$" + stripZeroFmt(s);
  }
  function commas(n) { return Math.round(n).toLocaleString("en-US"); }
  function sumTokens(tt) {
    if (!tt) return 0;
    return TOKEN_FIELDS.reduce(function(a, f) { return a + (tt[f] || 0); }, 0);
  }
  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function parseISO(s) {
    var p = s.split("-");
    return new Date(Date.UTC(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10)));
  }
  function isoOf(d) { return d.toISOString().slice(0, 10); }
  function addDays(d, n) { return new Date(d.getTime() + n * 86400000); }

  /** codex 订阅判定：plan.plan_type 是非空字符串才算有效套餐。全部重标价（按量
   *  标价 vs 账单）的唯一开关，与 codex_cost.py::plan_line 同判定。 */
  function isSubscription(d) {
    return !!(d && d.plan && typeof d.plan.plan_type === "string" && d.plan.plan_type);
  }
  /** 窗口分钟数 → 人读标签：300→5小时、10080→每周、其余 Nmin（Codex UI 同款） */
  function windowLabel(wm) {
    if (wm === 300) return "5小时";
    if (wm === 10080) return "每周";
    return String(wm) + "min";
  }
  /** used_percent → 文本：固定 3 位小数去尾零（67.0 → 67、67.5 → 67.5） */
  function pctText(up) {
    var s = Number(up).toFixed(3).replace(/0+$/, "").replace(/\.$/, "");
    return s === "" ? "0" : s;
  }
  /** Unix 秒 → 北京时区（UTC+8 强制，与 report 的 today/month 同口径，不随浏览器
   *  时区漂移）：今天 → `HH:MM`，否则 → `M月D日 HH:MM`。DATA.today 是唯一「今天」来源。 */
  function formatReset(ts) {
    var d = new Date(ts * 1000 + 8 * 3600 * 1000);
    function p(n) { return (n < 10 ? "0" : "") + n; }
    var hhmm = p(d.getUTCHours()) + ":" + p(d.getUTCMinutes());
    var m = d.getUTCMonth() + 1, dd = d.getUTCDate();
    var key = d.getUTCFullYear() + "-" + p(m) + "-" + p(dd);
    if (DATA && DATA.today === key) return hhmm;
    return m + "月" + dd + "日 " + hhmm;
  }
  /** 配额条颜色：占用越高越告警——<70% accent、70–90% warn、≥90% unpriced。
   *  配额是「还剩多少」的告警语义，三档离散色比连续色阶更诚实。 */
  function quotaColor(up) {
    if (up >= 90) return "var(--unpriced)";
    if (up >= 70) return "var(--warn)";
    return "var(--accent)";
  }
  var WEEKDAYS = ["日", "一", "二", "三", "四", "五", "六"];

  /** 执行环境 + 视图路由（统一范式，见 docs/UNIFIED_COST_VIEW.md）：
   *  `?harness=` 选执行环境，`?file=` 选该执行环境的视图。没有 `?harness=` 时用注入的
   *  `window.AGENT_VITALS_DEFAULT_HARNESS`（默认 "dsh"）——保证 xbar「打开
   *  日历」和 `calendar --source today` 与合并前的行为完全一致；没有
   *  `?file=` 时用各执行环境声明的 defaultMode（DSH 可被注入覆盖）。 */
  function getHarness() {
    var p = new URLSearchParams(location.search);
    var fallback = (typeof window.AGENT_VITALS_DEFAULT_HARNESS === "string"
                    && window.AGENT_VITALS_DEFAULT_HARNESS) || "dsh";
    var h = (p.get("harness") || fallback).toLowerCase();
    return HARNESSES[h] ? h : "dsh";
  }
  function getMode(harness) {
    var p = new URLSearchParams(location.search);
    var cfg = HARNESSES[harness];
    var def = cfg.defaultMode;
    if (harness === "dsh" && typeof window.AGENT_VITALS_DEFAULT_MODE === "string"
        && window.AGENT_VITALS_DEFAULT_MODE) {
      def = window.AGENT_VITALS_DEFAULT_MODE;
    } else if (harness === "codex") {
      // codex 内联块的 default 字段驱动无 `?file=` 时的默认视图（codex-cost
      // --html 按请求月/全部/今天写 month|all|today，统一看板写 month）。
      var blk = document.getElementById("agent-vitals-data-codex");
      if (blk && blk.textContent.trim()) {
        try {
          var d = JSON.parse(blk.textContent);
          if (d && d.default && cfg.modes.indexOf(d.default) >= 0) def = d.default;
        } catch (e) {}
      }
    }
    var f = (p.get("file") || def).toLowerCase();
    return cfg.modes.indexOf(f) >= 0 ? f : cfg.defaultMode;
  }

  // ─── 执行环境注册表（统一范式） ─────────────────────────────────────────
  // 每个执行环境声明：label / 视图模式 / 默认视图 / 内联数据布局 / 渲染适配器。
  // DSH 是 0 号模板（双块嵌入 + 既有渲染，tests/test_cli_m3 钉死）；Codex 是
  // 1 号执行环境（规范化单块 {views, default}）。新增执行环境 = 往这里加一项，共享
  // 核心不感知执行环境字段。
  var HARNESSES = {
    dsh: {
      label: "DSH",
      modes: ["today", "month"],
      defaultMode: "month",
      modeLabels: { today: "today · 24h", month: "month · 月度" },
      render: renderDshView,
      inlineData: dshInline,
      fetchUrl: function(home, mode) { return home + "/" + mode + ".json"; },
    },
    codex: {
      label: "Codex",
      modes: ["today", "month", "all"],
      defaultMode: "month",
      modeLabels: { today: "today", month: "month · 月度", all: "all · 全部" },
      render: renderCodexView,
      inlineData: codexInline,
      fetchUrl: null,   // codex 无状态文件，不 fetch
    },
  };

  /** DSH 内联数据：双块 `agent-vitals-data-{mode}`（只内联磁盘上存在的那份），
   * 兼容旧版单块 `agent-vitals-data`（按 schema 推断 mode）。返回：
   *  {data} | {data, inferred, legacy} | {stale, stale_date} | {parseError} | null */
  function dshInline(mode) {
    var inline = document.getElementById("agent-vitals-data-" + mode);
    var legacyInline = null;
    if (!inline) {
      // 兼容旧版 CLI 生成的文件（只有一个通用 id，没有按 mode 拆分）——
      // 那种文件的内联数据 schema 未必等于 URL 决定的 mode，需要按数据形状
      // 推断一次，与文件选择器分支的「智能推断 mode」用同一条判定。
      legacyInline = document.getElementById("agent-vitals-data");
    }
    var activeInline = inline || legacyInline;
    if (!activeInline || !activeInline.textContent.trim()) return null;
    try {
      var data = JSON.parse(activeInline.textContent);
      if (data && data.stale) {
        // today.json 判定为陈旧（date 字段不是真实今天）——今天还没有新会话，
        // 不是"读不到文件"。返回哨兵给 bootstrap 拦下，给清晰文案。
        return { stale: true, stale_date: data.stale_date };
      }
      if (legacyInline) {
        var inferred = (data && data.days && !data.buckets) ? "month" : "today";
        if (inferred !== mode) return { data: data, inferred: inferred, legacy: true };
        return { data: data, legacy: true };
      }
      return { data: data };
    } catch (e) {
      return { parseError: e.message };
    }
  }

  /** Codex 内联数据：规范化单块 `agent-vitals-data-codex`（{views, default}）。
   * 无状态、无磁盘文件可 fetch——只有这一条数据通道。 */
  function codexInline(mode) {
    var el = document.getElementById("agent-vitals-data-codex");
    if (!el || !el.textContent.trim()) return null;
    try {
      var d = JSON.parse(el.textContent);
      var view = (d && d.views) ? d.views[mode] : null;
      if (!view) return null;
      return { data: view };
    } catch (e) {
      return { parseError: e.message };
    }
  }

  /** 执行环境/视图切换：harness-switch active + 链接（保留当前 file，目标执行环境不支持
   * 就落其默认）；mode-switch 按当前执行环境 modes 重建。 */
  function buildNav(harness, mode) {
    ["dsh", "codex"].forEach(function(h) {
      var a = document.getElementById("link-harness-" + h);
      a.classList.toggle("active", h === harness);
      var cfg = HARNESSES[h];
      var file = cfg.modes.indexOf(mode) >= 0 ? mode : cfg.defaultMode;
      a.href = "?harness=" + h + "&file=" + file;
    });
    var msw = document.getElementById("mode-switch");
    msw.innerHTML = "";
    HARNESSES[harness].modes.forEach(function(m) {
      var a = document.createElement("a");
      a.href = "?harness=" + harness + "&file=" + m;
      a.id = "link-" + m;
      a.textContent = HARNESSES[harness].modeLabels[m] || m;
      a.className = (m === mode) ? "active" : "";
      msw.appendChild(a);
    });
  }

  // ─── 数据加载 ──────────────────────────────────────────────────────────

  /**
   * 先 try fetch()——若 html 来自 http://localhost 且用户配置 CORS 允许，
   * fetch 能工作；否则 CORS 抛错，UI 退到 file input fallback。
   *
   * 注：**绝大多数情况下 fetch 一定失败**（浏览器拿不到 ~/.agent-vitals/），
   * 这是设计而非 bug。fetch 尝试一次保留给「agent-vitals 自托管 http
   * 服务」的扩展场景。
   */
  function tryFetch(url) {
    return fetch(url, { cache: "no-store" })
      .then(function(r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      });
  }

  function loadFromFile(file) {
    return new Promise(function(resolve, reject) {
      var fr = new FileReader();
      fr.onload = function() {
        try { resolve(JSON.parse(fr.result)); }
        catch (e) { reject(new Error("JSON 解析失败：" + e.message)); }
      };
      fr.onerror = function() { reject(new Error("文件读取失败")); };
      fr.readAsText(file, "utf-8");
    });
  }

  function setStatus(msg, isErr) {
    var el = document.getElementById("status");
    el.textContent = msg;
    el.classList.toggle("err", !!isErr);
  }

  /**
   * 主加载流程：
   *   1. fetch 默认路径（极可能 CORS 失败）
   *   2. 失败时挂上 file input handler，等用户选文件
   *   3. 用户选择 → parse → render
   *
   * 不阻塞 UI：fetch 失败后页面仍可滚动、tooltip 仍可工作——只是日历不
   * 渲染，等用户喂数据。
   */
  function bootstrap() {
    var harness = getHarness();
    var cfg = HARNESSES[harness];
    var mode = getMode(harness);
    HOME = (typeof window.AGENT_VITALS_STATE_HOME === "string"
            && window.AGENT_VITALS_STATE_HOME) || STATE_HOME_DEFAULT;
    var url = cfg.fetchUrl ? cfg.fetchUrl(HOME, mode) : null;

    // 执行环境/视图切换 active 状态 + mode-switch 链接（按执行环境 modes 注入）
    buildNav(harness, mode);
    document.title = "Agent Vitals · " + cfg.label + " · " + mode + " · M4";

    // ── 数据加载三段式 ──────────────────────────────────────────
    // 1. **inline 优先** — calendar CLI 在渲染时把执行环境数据内联进
    //    `<script id="agent-vitals-data-…">`（DSH 双块 today|month，codex
    //    单块 {views}），这是唯一一条不需要网络/CORS 的路径,**保证 file://
    //    双击也能渲染**,而且每个 tab 都点得动。
    // 2. fetch 备选 — 浏览器从 http:// 自托管站点拉 JSON（执行环境声明了
    //    fetchUrl 才走；codex 无状态文件，没有这一路）。
    // 3. file picker 兜底 — fetch 也失败时,用户手动选文件（DSH state 文件
    //    或 codex 报告 JSON）。
    // 三段全失败 → 显示 empty state,不假装成功。
    var loaded = cfg.inlineData(mode);
    if (loaded && loaded.data) {
      if (loaded.legacy) {
        // 兼容旧版 CLI 生成的文件（只有一个通用 id,没有按 mode 拆分）——
        // 按数据形状推断 mode（与文件选择器分支同一条判定）。
        if (loaded.inferred && loaded.inferred !== mode) {
          mode = loaded.inferred;
          buildNav(harness, mode);
          document.title = "Agent Vitals · " + cfg.label + " · " + mode + " · M4";
        }
        setStatus("已加载 inline 数据（旧格式按 schema 推断）");
      } else {
        setStatus("已加载 inline 数据（" + mode + ".json）");
      }
      render(harness, mode, loaded.data);
      return;  // 成功就不走 fetch/file picker 了
    }
    if (loaded && loaded.stale) {
      // today.json 判定为陈旧（date 字段不是真实今天）——今天还没有新会话,
      // 不是"读不到文件"。必须拦在这里给清晰文案,不能落空继续往 fetch 走
      // （那条路径在 file:// 下必然撞 CORS,把"今天还没数据"这个正常状态
      // 显示成一句吓人的网络错误）。
      setStatus("今天还没有新的 DSH 会话（上一条记录停在 " +
                (loaded.stale_date || "更早") + "），暂无数据。");
      render(harness, mode, (harness === "dsh" && mode === "today")
                        ? { buckets: {} } : { days: {} });
      return;
    }
    if (loaded && loaded.parseError) {
      setStatus("inline JSON 解析失败：" + loaded.parseError, true);
      // 退到 fetch
    }

    if (url) {
      setStatus("尝试 fetch " + url + " …");
      tryFetch(url).then(function(data) {
        setStatus("fetch 成功（" + mode + ".json）");
        render(harness, mode, data);
      }).catch(function() {
        // CORS / 404 / 权限——预期路径。给清晰的状态文案，不假装失败
        setStatus("fetch 失败：浏览器读取本地文件被 CORS 阻止。" +
                  "请用下方按钮选择 " + mode + ".json。", true);
      });
    } else {
      // 执行环境没有可 fetch 的外部数据源（如 codex 无状态文件），又没有内联——
      // 直接说明，不装模作样走网络。
      setStatus("该执行环境（" + cfg.label + "）没有可 fetch 的外部数据源，且本文件" +
                "未内联其数据。请用 `agent-vitals calendar` 重新生成后打开。", true);
    }

    // 文件输入 handler——一次绑定，全局复用
    document.getElementById("file-input").addEventListener("change", function(e) {
      var file = e.target.files && e.target.files[0];
      if (!file) return;
      setStatus("读取 " + file.name + " …");
      loadFromFile(file).then(function(data) {
        setStatus("已加载 " + file.name);
        if (harness === "codex") {
          // codex 文件：统一单块 {views} 或单份报告 dict（codex-cost --json）
          var view = (data && data.views) ? data.views[mode]
                     : (data && data.total_cost_usd !== undefined ? data : null);
          if (!view) {
            setStatus("该文件不是 codex 成本报告（缺 views / total_cost_usd）", true);
            return;
          }
          render(harness, mode, view);
          return;
        }
        // DSH state 文件：智能推断 mode（含 buckets=hours 是 today；含 days
        // 是 month）。允许用户选错文件也能渲染。
        var inferred = (data && data.days && !data.buckets) ? "month" : "today";
        if (inferred !== mode) {
          setStatus("已加载 " + file.name + "（按 schema 推断为 " +
                    inferred + " 模式渲染）");
        }
        render(harness, inferred, data);
      }).catch(function(err) {
        setStatus(err.message, true);
      });
    });
  }

  // ─── 渲染 ──────────────────────────────────────────────────────────────

  /** 全局：当前执行环境 + 视图 + payload，供 DSH tooltip 复用 */
  var CURRENT = { harness: null, mode: null, payload: null };

  /** 渲染入口：按执行环境注册表分发。先画跨执行环境今日总览（best-effort，两执行环境 today
   *  数据都可能缺席），再调执行环境的渲染适配器。#render-root 的 className 是执行环境
   *  作用域（`.view-codex` 下的 CSS 全是 codex 私有样式），DSH 用空串。 */
  function render(harness, mode, view) {
    CURRENT = { harness: harness, mode: mode, payload: view };
    var root = document.getElementById("render-root");
    root.className = (harness === "codex") ? "view-codex" : "";
    document.getElementById("summary").hidden = false;
    renderOverview(overviewData(harness, mode, view));
    HARNESSES[harness].render(harness, mode, view);
  }

  /** DSH 渲染适配器（0 号模板）：写 #sub-line，委托给既有 renderToday/
   *  renderMonth——渲染逻辑一行不改，page-title 保持 M4 原串。 */
  function renderDshView(harness, mode, view) {
    document.getElementById("sub-line").innerHTML =
      '数据源 <code>~/.agent-vitals/state/</code>' +
      ' · schema <code>1.0.0</code>';
    document.getElementById("page-title").textContent =
      (mode === "today") ? "今日 · 24 小时分布" : "本月 · 日历";
    if (mode === "today") renderToday(view);
    else                  renderMonth(view);
  }

  // ── today 模式（DSH）──────────────────────────────────────────────────

  function renderToday(payload) {
    var buckets = (payload && payload.buckets) || {};
    var totalTok = 0, totalCost = 0, peakTok = 0;

    // 先聚合 summary。today.json 的 by_model 是整天一个总量,没法按小时
    // 拆分精算,所以精确总额（payload.accurate_cost,见 cli.py::
    // _augment_calendar_cost）只覆盖「今日估算成本」这一张卡片；per-hour
    // 小时格子/tooltip 仍用 costOf() 的近似公式——不假装有数据不具备的
    // 精度。
    var hasAccurateTotal = payload && payload.accurate_cost
      && typeof payload.accurate_cost.total === "number";
    Object.keys(buckets).forEach(function(k) {
      var b = buckets[k];
      totalTok += totalTokens(b);
      if (!hasAccurateTotal) totalCost += costOf(b).total;
      if (isPeak(b)) peakTok += totalTokens(b);
    });
    if (hasAccurateTotal) totalCost = payload.accurate_cost.total;

    renderSummary([
      { label: "今日总 token", value: n(totalTok), note: "" },
      { label: "今日估算成本", value: money(totalCost),
        note: hasAccurateTotal ? "按实际模型精算" : "deepseek-v4-flash 默认价（近似）" },
      {
        label: "peak 时段占比",
        value: totalTok === 0 ? "—" : ((peakTok/totalTok*100).toFixed(1) + "%"),
        note: totalTok === 0 ? "" :
              ("peak token " + n(peakTok) + " / " + n(totalTok))
      },
      {
        label: "活跃小时",
        value: Object.keys(buckets).filter(function(k){
          return totalTokens(buckets[k]) > 0;
        }).length + " / 24",
        note: "本地时区 (Beijing)"
      },
    ]);

    var root = document.getElementById("render-root");
    root.innerHTML = "";
    var panel = document.createElement("section");
    panel.className = "panel";
    panel.innerHTML =
      '<div class="panel-head">' +
        '<h2 class="panel-title">今日 24 小时</h2>' +
        '<div class="panel-sub">每格 = 该小时聚合 token；橙色边框 = 含 peak 时段份额</div>' +
      '</div>' +
      '<div class="today-grid" id="grid"></div>';
    root.appendChild(panel);

    var grid = panel.querySelector("#grid");

    // 0..23 顺序填——空小时也占位（保持视觉对齐 24 小时刻度）
    var maxTok = 1;
    Object.keys(buckets).forEach(function(k) {
      maxTok = Math.max(maxTok, totalTokens(buckets[k]));
    });

    // 第一列：左侧轴标签（"hour"）
    var axis = document.createElement("div");
    axis.className = "today-axis";
    axis.textContent = "hour";
    grid.appendChild(axis);

    for (var h = 0; h < 24; h++) {
      var b = buckets[String(h)];
      var tok = b ? totalTokens(b) : 0;
      var cell = document.createElement("div");
      cell.className = "hour-cell" + (b && isPeak(b) ? " peak" : "")
                      + (tok === 0 ? " empty" : "");
      cell.style.background = colorFor(tok, maxTok, tok === 0);
      // 必须显式指定列，不能靠 CSS Grid 自动排布——`.hour-cell` 只在
      // CSS 里定了 grid-row:1，没定 grid-column，于是浏览器的自动排布
      // 算法会先把它（先出现在 DOM 里，且是"行确定、列不确定"这一类）
      // 从第 1 列开始摆，而 `.today-axis` 的列虽然固定是 1，但它是"列
      // 确定、行不确定"那一类，排布顺序上反而排在 cell 后面——于是
      // hour-cell(h) 占了第 h+1 列，比下面 hour-label(h) 用的 h+2 整整
      // 少 1，效果是每根柱子都画在它自己刻度标签的左边一格：柱子上真实
      // 是 07 点的数据，视觉上却对到 06 那一列的位置下方（真机复现：
      // 北京时间下午查看，条形图却在 21、22 点有数据，一部分就是这个
      // 偏移让人以为柱子在更早的位置）。显式指定成跟 label 同一条公式，
      // 让两者锁死对齐，不再依赖自动排布算法的处理顺序。
      cell.style.gridColumn = String(h + 2); // +2: 第一列是 axis，与下面 label 用同一条公式
      cell.dataset.hour = String(h);
      cell.dataset.tok = String(tok);
      cell.innerHTML =
        '<div class="hour-tag">' + String(h).padStart(2, "0") + '</div>' +
        (tok > 0 ? '<div class="amt">' + shortNum(tok) + '</div>' : '');
      grid.appendChild(cell);

      // 底部 hour-label 行——与上方单元格对齐
      var lbl = document.createElement("div");
      lbl.className = "hour-label" + (h % 6 === 0 ? " heavy" : "");
      lbl.textContent = String(h).padStart(2, "0");
      // grid-row: hour-label 用 grid-row 2，所有 label 在第二行；放最后即可
      lbl.style.gridRow = "2";
      lbl.style.gridColumn = String(h + 2); // +2: 第一列是 axis
      grid.appendChild(lbl);
    }

    bindHover(grid, ".hour-cell");
  }

  // ── month 模式 ────────────────────────────────────────────────────────

  function renderMonth(payload) {
    var days = (payload && payload.days) || {};
    var month = (payload && payload.month) || "";
    var totalTok = 0, totalCost = 0;
    var peakDays = 0, activeDays = 0;
    // 逐天判断精算/部分精算/近似——有的月份新旧数据并存(这个功能上线前的
    // 历史日没有 by_model,退回近似;上线后的日子精算),costOf() 已经按
    // 每天各自有没有 b.cost 决定总价(部分覆盖的那一截已经在服务端用
    // fallback 价补齐,不是漏算),这里只汇总一下用什么措辞标注给用户看。
    //
    // `pricing_basis === "partial"`：由 cli.py::_augment_calendar_cost
    // 在 by_model 只覆盖当天一部分 token 时打上（例如一个跨零点的会话
    // 只把某一天的切片记了下来）——总价已经是「精算部分 + fallback 补齐
    // 部分」，不是偏低的数字，但不该被措辞说成"按实际模型精算"，否则用户
    // 会以为整天都是精确价。
    var anyApprox = false, anyExact = false, anyPartial = false;

    Object.keys(days).forEach(function(k) {
      var b = days[k];
      totalTok += totalTokens(b);
      totalCost += costOf(b).total;
      if (b.cost && typeof b.cost.total === "number") {
        if (b.cost.pricing_basis === "partial") anyPartial = true;
        else anyExact = true;
      } else if (totalTokens(b) > 0) {
        anyApprox = true;
      }
      if (isPeak(b)) peakDays++;
      if (totalTokens(b) > 0) activeDays++;
    });
    var costNote = anyPartial ? "部分日期按模型精算+近似补齐（会话跨日切片未全覆盖）"
                 : !anyExact ? "deepseek-v4-flash 默认价（近似）"
                 : !anyApprox ? "按实际模型精算"
                 : "部分按模型精算，历史日为近似";

    renderSummary([
      { label: "本月总 token", value: n(totalTok), note: month },
      { label: "本月估算成本", value: money(totalCost), note: costNote },
      {
        label: "peak 日占比",
        value: activeDays === 0 ? "—" :
               ((peakDays/Object.keys(days).length*100).toFixed(1) + "%"),
        note: activeDays === 0 ? "" :
               (peakDays + " 天含 peak 时段 / " + Object.keys(days).length + " 天")
      },
      {
        label: "活跃日",
        value: activeDays + " / " + Object.keys(days).length,
        note: "按 token > 0 计"
      },
    ]);

    // 决定 1 号是星期几——取 payload.month（YYYY-MM）的第一天
    var firstDate = month ? (month + "-01") : null;
    var firstDow = firstDate ? new Date(firstDate + "T00:00:00Z").getUTCDay() : 0;
    // getUTCDay 用 UTC；state.py 用北京时间；用 UTC 算 weekday 在 BJ 14:00 前
    // 会有 ±1 偏差。改用 BJ 0:00 = UTC -8，即 UTC 16:00 前一天。这里直接
    // 用 UTC 0:00 算——偏差最多 1 天，但视觉上「1 号从周几开始」用户对
    // 偏差宽容，月历错位一格比完全错位好接受。
    // 注：若用户在 BJ 凌晨看日历时 firstDow 会偏 1 天，是已知 trade-off。

    var daysInMonth = firstDate
      ? new Date(Date.UTC(
          parseInt(firstDate.slice(0,4), 10),
          parseInt(firstDate.slice(5,7), 10), 0)).getUTCDate()
      : 31;

    var root = document.getElementById("render-root");
    root.innerHTML = "";
    var panel = document.createElement("section");
    panel.className = "panel";
    panel.innerHTML =
      '<div class="panel-head">' +
        '<h2 class="panel-title">' + (month || "本月") + ' · ' + daysInMonth + ' 天</h2>' +
        '<div class="panel-sub">每格 = 当日聚合 token / 估算成本；蓝框 = 今天</div>' +
      '</div>' +
      '<div class="month-head" id="mhead"></div>' +
      '<div class="month-grid" id="mgrid"></div>';
    root.appendChild(panel);

    var head = panel.querySelector("#mhead");
    ["日","一","二","三","四","五","六"].forEach(function(d) {
      var el = document.createElement("div"); el.textContent = d;
      head.appendChild(el);
    });

    var grid = panel.querySelector("#mgrid");
    var todayStr = isoTodayBJ();

    // 月历里的最大 token，用于色阶归一化
    var maxTok = 1;
    Object.keys(days).forEach(function(k) {
      maxTok = Math.max(maxTok, totalTokens(days[k]));
    });

    // 1 号之前的空格
    for (var i = 0; i < firstDow; i++) {
      var e = document.createElement("div");
      e.className = "day-cell empty";
      grid.appendChild(e);
    }
    // 每天一格
    for (var d = 1; d <= daysInMonth; d++) {
      var k = month + "-" + String(d).padStart(2, "0");
      var b = days[k];
      var tok = b ? totalTokens(b) : 0;
      var c = b ? costOf(b) : { total: 0 };
      var cell = document.createElement("div");
      cell.className = "day-cell"
        + (tok === 0 ? " empty" : "")
        + (k === todayStr ? " today" : "");
      cell.style.background = colorFor(tok, maxTok, tok === 0);
      cell.dataset.day = k;
      cell.dataset.tok = String(tok);
      cell.innerHTML =
        '<div class="num">' + d +
          (b && isPeak(b) ? '<span class="peak-dot" title="peak 时段"></span>' : '') +
        '</div>' +
        (tok > 0
          ? '<div class="amt">' + shortNum(tok) + (c.total > 0 ? '<div class="cost">' + money(c.total) + '</div>' : '') + '</div>'
          : '');
      grid.appendChild(cell);
    }

    bindHover(grid, ".day-cell");
  }

  // ── codex 执行环境渲染（1 号执行环境适配器）──────────────────────────────────
  // 数据契约 = codex-cost 报告的同一份 dict（views 的每个成员）。JS 只渲染
  // server 已算好的 cost/tokens，不重算任何价。today 视图画小时条（hours 轴），
  // month/all 画日热力图（days 轴）——与 DSH 同一结构（小时 → 天聚合）。

  var DATA = null;   // codex 当前视图（formatReset 读 DATA.today）

  function renderCodexView(harness, mode, view) {
    DATA = view;
    document.getElementById("sub-line").innerHTML =
      "harness <code>codex</code> · currency <code>USD</code>" +
      (view && view.month ? " · month <code>" + esc(view.month) + "</code>" : "");
    document.getElementById("page-title").textContent =
      "Codex 成本" + (view && view.month ? " · " + view.month : "");

    var root = document.getElementById("render-root");
    root.innerHTML = "";
    var hasData = view && view.per_model &&
                  (Object.keys(view.per_model).length > 0 ||
                   (view.days && view.days.length > 0));
    renderCodexSummary(view);
    if (!hasData) {
      // 空折叠：全零结构也照画（诚实标「没有可计价 token」），不假装成功。
      var empty = mkPanel("Codex 成本", "空折叠");
      empty.querySelector(".panel-body").appendChild(textNote(
        "暂无 token 可计价（空折叠）——最近没有可折叠的 rollout 会话。"));
      root.appendChild(empty);
      setStatus("暂无 token 可计价（空折叠）");
      return;
    }

    if (isSubscription(view)) {
      var q = mkPanel("配额",
        "订阅套餐限速快照 · 来自日志 rate_limits（零网络）");
      renderCodexQuota(view, q);
      root.appendChild(q);
    }
    var modelPanel = mkPanel("按模型明细",
      "5 桶 token + USD 费用；无价目模型标 unpriced，token 计入 <code>unpriced_tokens</code>");
    renderCodexModelTable(view, modelPanel);
    root.appendChild(modelPanel);

    if (mode === "today") {
      var hourPanel = mkPanel("今日 24 小时",
        "每格 = 该小时 cost（log 着色）· hover 看明细；无数据小时留空");
      renderCodexHourStrip(view, hourPanel);
      root.appendChild(hourPanel);
    } else {
      var heatPanel = mkPanel("每日热力图",
        "每格 = 当日总 cost（log 着色）· hover 看明细；无数据日留空");
      renderCodexHeatmap(view, heatPanel);
      root.appendChild(heatPanel);
    }
    renderCodexExtra(view);
  }

  /** 面板骨架：.panel + .panel-head（title + sub）+ .panel-body。动态创建——
   *  统一模板只有一个执行环境在渲染，不能像 codex_cost.html 那样静态占位。 */
  function mkPanel(title, sub) {
    var panel = document.createElement("section");
    panel.className = "panel";
    panel.innerHTML =
      '<div class="panel-head">' +
        '<h2 class="panel-title">' + esc(title) + '</h2>' +
        (sub ? '<div class="panel-sub">' + sub + '</div>' : '') +
      '</div>' +
      '<div class="panel-body"></div>';
    return panel;
  }

  function textNote(text) {
    var d = document.createElement("div");
    d.textContent = text;
    d.style.color = "var(--fg-muted)";
    return d;
  }

  function renderCodexSummary(view) {
    var d = view || {};
    var totalTok = sumTokens(d.total_tokens);
    var modelNames = Object.keys(d.per_model || {});
    var priced = 0;
    modelNames.forEach(function(m) { if (d.per_model[m].priced) priced++; });
    var activeDays = (d.days || []).filter(function(x) { return x.tokens > 0; }).length;
    var sub = isSubscription(d);
    var noteCost = d.month
      ? ("USD · 已计价 " + priced + " / " + modelNames.length + " 模型")
      : ("USD · 全部月份 · 已计价 " + priced + " / " + modelNames.length + " 模型");
    if (sub) {
      // 订阅套餐：per-token 美元是标价不是账单——账单 = 套餐固定费。诚实标注。
      noteCost += " · 账单 = " + d.plan.plan_type + " 套餐固定费";
    }
    var cards = [
      { label: sub ? "按量标价" : "总成本", value: fmtUsd(d.total_cost_usd || 0), note: noteCost },
      { label: "总 token", value: formatNumber(totalTok), note: "5 桶合计" },
      { label: "模型数", value: String(modelNames.length), note: priced + " 个已计价" },
      { label: "有数据天数", value: activeDays + " / " + (d.days ? d.days.length : 0),
        note: "按 token > 0 计" },
    ];
    if (d.unpriced_tokens > 0) {
      cards.push({ label: "未计价 token", value: formatNumber(d.unpriced_tokens),
        note: "无价目模型，成本不计入总额" });
    }
    renderSummary(cards);
  }

  function renderCodexQuota(view, panel) {
    var body = panel.querySelector(".panel-body");
    var plan = view.plan;
    if (!plan || !plan.limits) return;
    Object.keys(plan.limits).forEach(function(name) {   // 键序 = 折叠写入序
      var win = plan.limits[name];
      if (!win || typeof win.used_percent !== "number") return;
      var up = win.used_percent;
      var remaining = Math.max(0, 100 - up);            // 剩余 = 100 − 占用
      var bar = Math.min(up, 100);                      // >100 截断显示，不撑破条
      var color = quotaColor(up);                       // 告警色仍按占用算
      var row = document.createElement("div");
      row.className = "quota-row";
      row.innerHTML =
        '<div class="q-head">' +
          '<span class="q-label">' + windowLabel(win.window_minutes) + '</span>' +
          '<span class="q-pct" style="color:' + color + '">剩余 ' + pctText(remaining) + '%</span>' +
        '</div>' +
        '<div class="quota-bar">' +
          '<div class="q-fill" style="width:' + bar + '%;background:' + color + '"></div>' +
        '</div>' +
        (typeof win.resets_at === "number"
          ? '<div class="q-reset">重置：' + formatReset(win.resets_at) + '</div>'
          : '');
      body.appendChild(row);
    });
  }

    var d = view;
    var table = document.createElement("table");
    table.className = "model-table";

        totalOut = 0, totalRea = 0, totalTok = 0;

        "<td class='speed'>" + esc(pm.speed || "standard") + "</td>" +
        "<td>" + formatNumber(unc) + "</td>" +
        "<td>" + formatNumber(cac) + "</td>" +
        "<td>" + formatNumber(wrt) + "</td>" +
        "<td>" + formatNumber(out) + "</td>" +
        "<td>" + formatNumber(rea) + "</td>" +
        "<td>" + formatNumber(tok) + "</td>" +
        (pm.priced
          ? "<td class='cost'>" + fmtUsd(pm.cost_usd || 0) + "</td>" +
            "<td>priced</td>"

            "<td class='unpriced'>unpriced</td>");

    var foot = document.createElement("tfoot");

      "<td>" + formatNumber(totalWrt) + "</td>" +
      "<td>" + formatNumber(totalOut) + "</td>" +
      "<td>" + formatNumber(totalRea) + "</td>" +
      "<td>" + formatNumber(totalTok) + "</td>" +
      "<td class='cost'>" + fmtUsd(totalCost) + "</td>" +
      "<td>" + (d.unpriced_tokens > 0 ? "<span style='color:var(--unpriced)'>含 " +
                formatNumber(d.unpriced_tokens) + " 未计价</span>" : "—") + "</td>";
    foot.appendChild(trf);
    table.appendChild(foot);
    // min-width:720px 的宽表套滚动容器（`.model-table-root`），窄窗不撑破面板
    var wrap = document.createElement("div");
    wrap.className = "model-table-root";

  // ── codex today 小时条 ─────────────────────────────────────────────────

  function renderCodexHourStrip(view, panel) {
    var body = panel.querySelector(".panel-body");
    var hours = (view && view.hours) || [];
    var byHour = {};
    hours.forEach(function(h) { byHour[h.hour] = h; });
    var today = view.today || "";
    var maxCost = 1;
    hours.forEach(function(h) { if (h.cost_usd > maxCost) maxCost = h.cost_usd; });

    var grid = document.createElement("div");
    grid.className = "today-grid";
    var axis = document.createElement("div");
    axis.className = "today-axis";
    axis.textContent = "hour";
    grid.appendChild(axis);
    for (var hh = 0; hh < 24; hh++) {
      var key = today + "T" + String(hh).padStart(2, "0");
      var entry = byHour[key];
      var has = !!(entry && entry.tokens > 0);
      var cell = document.createElement("div");
      cell.className = "hour-cell" + (has ? "" : " empty");
      cell.style.gridRow = "1";
      cell.style.gridColumn = String(hh + 2);   // +2: 第一列是 axis（与 DSH 同公式）
      cell.style.background = colorFor(entry ? entry.cost_usd : 0, maxCost, !has);
      cell.dataset.hour = key;
      cell.dataset.tokens = entry ? String(entry.tokens) : "0";
      cell.dataset.cost = entry ? String(entry.cost_usd) : "0";
      cell.innerHTML =
        '<div class="hour-tag">' + String(hh).padStart(2, "0") + '</div>' +
        (has ? '<div class="amt">' + shortNum(entry.tokens) + '</div>' : '');
      grid.appendChild(cell);
      var lbl = document.createElement("div");
      lbl.className = "hour-label" + (hh % 6 === 0 ? " heavy" : "");
      lbl.textContent = String(hh).padStart(2, "0");
      lbl.style.gridRow = "2";
      lbl.style.gridColumn = String(hh + 2);
      grid.appendChild(lbl);
    }
    body.appendChild(grid);
    bindCodexTip(grid, ".hour-cell");
  }

  // ── codex 日热力图（month/all 视图）────────────────────────────────────

  function renderCodexHeatmap(view, panel) {
    var body = panel.querySelector(".panel-body");
    var days = (view && view.days) || [];
    if (!days.length) {
      body.appendChild(textNote("该时间窗没有可渲染的日子。"));
      return;
    }
    var head = document.createElement("div");
    head.className = "wrow weekday-head";
    WEEKDAYS.forEach(function(w) {
      var el = document.createElement("div"); el.textContent = w; head.appendChild(el);
    });
    body.appendChild(head);
    var root = document.createElement("div");
    body.appendChild(root);

    var byDate = {};
    days.forEach(function(x) { byDate[x.date] = x; });
    // 色阶归一化：用日期轴的最大日 cost（log scale，同 DSH colorFor）。
    var maxCost = 1;
    days.forEach(function(x) { if (x.cost_usd > maxCost) maxCost = x.cost_usd; });

    // 从首日遍历到末日（含无数据日，保持真实日历连续性）——跨月份数据也按
    // 周对齐排，月份切换插一行月标题。今天无数据时把网格延长到今天（只在今天
    // 与末日同月时延长，`--month 2026-07` 的视图不能把下一整个月拖进来）。
    var first = parseISO(days[0].date);
    var last = parseISO(days[days.length - 1].date);
    if (view.today) {
      var tToday = parseISO(view.today);
      var lastMonth = isoOf(last).slice(0, 7);
      if (tToday.getTime() > last.getTime() && view.today.slice(0, 7) === lastMonth) {
        last = tToday;
      }
    }
    var row = [];
    for (var i = 0; i < first.getUTCDay(); i++) row.push(null);
    var cur = first;
    var curMonth = null;
    function flushRow() {
      while (row.length < 7) row.push(null);
      var wrow = document.createElement("div");
      wrow.className = "wrow";
      row.forEach(function(cell) {
        if (cell === null) {
          var pad = document.createElement("div");
          pad.className = "day-cell pad";
          wrow.appendChild(pad);
        } else {
          wrow.appendChild(cell);
        }
      });
      root.appendChild(wrow);
      row = [];
    }
    while (cur.getTime() <= last.getTime()) {
      var dow = cur.getUTCDay();
      if (dow === 0 && row.length > 0) flushRow();
      var key = isoOf(cur);
      var m = key.slice(0, 7);
      if (m !== curMonth) {
        if (curMonth !== null && row.length > 0) flushRow();
        curMonth = m;
        var mt = document.createElement("div");
        mt.className = "month-title";
        mt.textContent = m;
        root.appendChild(mt);
      }
      row.push(makeCodexDayCell(cur, key, byDate[key], maxCost));
      cur = addDays(cur, 1);
    }
    if (row.length) flushRow();
    bindCodexTip(root, ".day-cell[data-date]");
  }

  function makeCodexDayCell(dateObj, key, day, maxCost) {
    var cell = document.createElement("div");
    var dayNum = dateObj.getUTCDate();
    var isToday = DATA.today === key;
    if (!day) {
      cell.className = "day-cell empty";
      if (isToday) cell.className += " today";
      cell.innerHTML = '<div class="num">' + dayNum + '</div>';
      if (isToday) cell.innerHTML += '<span class="today-mark">今</span>';
      return cell;
    }
    var hasCost = day.cost_usd > 0;
    cell.className = "day-cell";
    if (isToday) cell.className += " today";
    cell.style.background = colorFor(day.cost_usd, maxCost, hasCost);
    cell.dataset.date = key;
    cell.dataset.cost = String(day.cost_usd);
    cell.dataset.tokens = String(day.tokens);
    cell.innerHTML =
      '<div class="num">' + dayNum + '</div>' +
      '<div class="amt">' + shortNum(day.tokens) +
        (hasCost ? '<div class="cost">' + fmtUsd(day.cost_usd) + '</div>' : '') +
      '</div>';
    if (isToday) cell.innerHTML += '<span class="today-mark">今</span>';
    return cell;
  }

  /** codex 自己的 tooltip 绑定（hour 格 + day 格共用）——不碰 DSH 的 bindHover/
   *  showTip，那套读 CURRENT.payload 是 DSH schema。 */
  function bindCodexTip(container, selector) {
    var tip = document.getElementById("tip");
    container.querySelectorAll(selector).forEach(function(el) {
      el.addEventListener("mouseenter", function() {
        var title;
        if (el.dataset.hour !== undefined) {
          var hh = el.dataset.hour;   // YYYY-MM-DDTHH
          title = hh.slice(5, 10) + " " + hh.slice(11) + ":00 时段";
        } else {
          title = el.dataset.date;
        }
        var toks = parseInt(el.dataset.tokens || "0", 10);
        var cost = parseFloat(el.dataset.cost || "0");
        tip.innerHTML =
          '<div class="tip-title">' + title + '</div>' +
          '<div class="row"><span class="k">总 token</span><span class="v">' +
            commas(toks) + '</span></div>' +
          '<div class="sep"></div>' +
          '<div class="row"><span class="k">' + (isSubscription(DATA) ? "标价" : "成本") +
            ' (USD)</span><span class="v">' + fmtUsd(cost) + '</span></div>';
        tip.classList.add("show");
      });
      el.addEventListener("mousemove", function(e) { positionTip(e); });
      el.addEventListener("mouseleave", function() { tip.classList.remove("show"); });
    });
  }

  // ── 跨执行环境今日总览 ─────────────────────────────────────────────────────
  // 「今日所有 Agent 总花费 + 每执行环境 mini 卡」是看板的第一层（见
  // docs/UNIFIED_COST_VIEW.md）。数据 best-effort：当前视图（harness, today）+
  // 内联块。缺失的执行环境就不出卡，不假装有数据。

  function overviewData(harness, mode, view) {
    var items = [];
    // DSH today：当前 (dsh, today) 直接用 view；否则读内联 today 块。
    var dshToday = null;
    if (harness === "dsh" && mode === "today" && view) dshToday = view;
    if (!dshToday) {
      var blk = document.getElementById("agent-vitals-data-today");
      if (blk && blk.textContent.trim()) {
        try {
          var d = JSON.parse(blk.textContent);
          if (d && !d.stale) dshToday = d;
        } catch (e) {}
      }
    }
    if (dshToday) {
      var tok = 0, cost = 0;
      var buckets = dshToday.buckets || {};
      Object.keys(buckets).forEach(function(k) { tok += totalTokens(buckets[k]); });
      if (dshToday.accurate_cost && typeof dshToday.accurate_cost.total === "number") {
        cost = dshToday.accurate_cost.total;
      } else {
        Object.keys(buckets).forEach(function(k) { cost += costOf(buckets[k]).total; });
      }
      items.push({ harness: "dsh", label: "DSH", currency: "¥", tokens: tok, cost: cost });
    }
    // Codex today：当前 (codex, today) 直接用 view；否则读内联 codex 块。
    var codexToday = null;
    if (harness === "codex" && mode === "today" && view) codexToday = view;
    if (!codexToday) {
      var cblk = document.getElementById("agent-vitals-data-codex");
      if (cblk && cblk.textContent.trim()) {
        try {
          var c = JSON.parse(cblk.textContent);
          if (c && c.views && c.views.today) codexToday = c.views.today;
        } catch (e) {}
      }
    }
    if (codexToday) {
      items.push({ harness: "codex", label: "Codex", currency: "$",
                   tokens: sumTokens(codexToday.total_tokens),
                   cost: codexToday.total_cost_usd || 0 });
    }
    return items;
  }

  function renderOverview(items) {
    var root = document.getElementById("overview");
    if (!items.length) { root.hidden = true; return; }
    root.hidden = false;
    var cards = document.getElementById("overview-cards");
    cards.innerHTML = "";
    // 跨执行环境今日总 token：币种无关，直接求和。
    var totalTok = 0;
    items.forEach(function(x) { totalTok += x.tokens; });
    cards.appendChild(cardEl("今日跨执行环境总 token", shortNum(totalTok),

    // 各币种今日花费——不编汇率，¥/$ 分列（币种不同的花费不强行相加）。
    var byCur = {};
    items.forEach(function(x) {
      byCur[x.currency] = (byCur[x.currency] || 0) + x.cost;
    });

                       .map(function(x) { return x.label; }).join(" / ");

        cur === "¥" ? money(byCur[cur]) : fmtUsd(byCur[cur]),
        harnesses + " · 不编汇率，币种分开列"));
    });
    // 每执行环境 mini 卡：点击跳该执行环境 today。

      var a = document.createElement("a");

        '<div class="value small">' + (x.currency === "¥" ? money(x.cost) : fmtUsd(x.cost)) + '</div>' +
        '<div class="note">' + shortNum(x.tokens) + ' tokens</div>';

  function cardEl(label, value, note) {
    var div = document.createElement("div");

  // ── summary 卡片 ─────────────────────────────────────────────────────

  function renderSummary(cards) {

  // ── 颜色映射（log scale）──────────────────────────────────────────────

  /**
   * 热力色阶：log10(1+token/max) → 0..1 → HSL hue 200→0（蓝→红）
   *
   * 选 log 是因为 token 分布是重尾的（几小时很低，几小时 100×），线
   * 性映射下低值格全是同色看不出来。用 log 后低值格也能看出梯度。
   *
   * 不用 d3-scale：再小也是 30KB+ 的第三方库，与「单文件 / 零外链」
   * 不兼容。
   */
  function colorFor(tok, maxTok, isEmpty) {
    if (isEmpty || tok === 0) return "var(--surface-2)";
    if (maxTok === 0) return "var(--surface-2)";
    var t = Math.log10(1 + tok) / Math.log10(1 + maxTok);
    var hue = Math.round(200 - 200 * t);  // 200→0 (蓝→红)
    var sat = 60;
    var lum = Math.round(28 + 22 * t);    // 28%→50%
    return "hsl(" + hue + "," + sat + "%," + lum + "%)";
  }

  // ── tooltip ──────────────────────────────────────────────────────────

  function bindHover(container, selector) {
    var tip = document.getElementById("tip");
    container.querySelectorAll(selector).forEach(function(el) {
      el.addEventListener("mouseenter", function() {
        showTip(el);
      });
      el.addEventListener("mousemove", function(e) {
        positionTip(e);
      });
      el.addEventListener("mouseleave", function() {
        tip.classList.remove("show");
      });
    });
  }

  function showTip(el) {
    var tip = document.getElementById("tip");
    var mode = CURRENT.mode;
    var payload = CURRENT.payload;
    if (!payload) return;

    var html = "";
    if (mode === "today") {
      var h = el.dataset.hour;
      var b = (payload.buckets || {})[h] || zeroBucket();
      var c = costOf(b);
      html =
        '<div class="tip-title">' + h + ":00 时段</div>" +
        row("uncached input", n(b.uncached_input_tokens||0)) +
        row("output", n(b.output_tokens||0)) +
        row("cache read", n(b.cache_read_tokens||0)) +
        row("cache write", n(b.cache_write_tokens||0)) +
        '<div class="sep"></div>' +
        row("peak input", n(b.peak_uncached_input_tokens||0), true) +
        row("peak output", n(b.peak_output_tokens||0), true) +
        row("peak cache read", n(b.peak_cache_read_tokens||0), true) +
        '<div class="sep"></div>' +
        row("total token", n(totalTokens(b))) +
        row("估算成本", money(c.total)) +
        row("其中 peak 时段", money(c.peak));
    } else {
      var d = el.dataset.day;
      var b = (payload.days || {})[d] || zeroBucket();
      var c = costOf(b);
      html =
        '<div class="tip-title">' + d + '</div>' +
        row("uncached input", n(b.uncached_input_tokens||0)) +
        row("output", n(b.output_tokens||0)) +
        row("cache read", n(b.cache_read_tokens||0)) +
        row("cache write", n(b.cache_write_tokens||0)) +
        '<div class="sep"></div>' +
        row("peak input", n(b.peak_uncached_input_tokens||0), true) +
        row("peak output", n(b.peak_output_tokens||0), true) +
        row("peak cache read", n(b.peak_cache_read_tokens||0), true) +
        '<div class="sep"></div>' +
        row("total token", n(totalTokens(b))) +
        row("估算成本", money(c.total)) +
        row("其中 peak 时段", money(c.peak)) +
        (b.cost && b.cost.pricing_basis === "partial"
          ? row("覆盖率", (b.cost.coverage * 100).toFixed(1) + "%（部分近似补齐）")
          : "");
    }
    tip.innerHTML = html;
    tip.classList.add("show");
  }

  function row(k, v, isPeak) {
    return '<div class="row"><span class="k">' + k +
           '</span><span class="v' + (isPeak ? ' peak-v' : '') + '">' + v + '</span></div>';
  }

  function positionTip(e) {
    var tip = document.getElementById("tip");
    var x = e.clientX + 14;
    var y = e.clientY + 14;
    var rect = tip.getBoundingClientRect();
    if (x + rect.width > window.innerWidth)  x = e.clientX - rect.width - 14;
    if (y + rect.height > window.innerHeight) y = e.clientY - rect.height - 14;
    tip.style.left = x + "px";
    tip.style.top  = y + "px";
  }

  // 空桶——tooltip 显示 0 时不报 undefined
  function zeroBucket() {
    return {
      uncached_input_tokens: 0, output_tokens: 0,
      cache_read_tokens: 0, cache_write_tokens: 0,
      peak_uncached_input_tokens: 0, peak_output_tokens: 0,
      peak_cache_read_tokens: 0, peak_cache_write_tokens: 0,
    };
  }

  /** 数字缩写（12345 → 12.3K） */
  function shortNum(n) {
    if (n < 1000) return String(n);
    if (n < 1e6) return (n/1e3).toFixed(n < 1e4 ? 1 : 0) + "K";
    if (n < 1e9) return (n/1e6).toFixed(n < 1e7 ? 1 : 0) + "M";
    return (n/1e9).toFixed(1) + "B";
  }

  /** 当前 BJ 日期（YYYY-MM-DD）——与 state.py::_today_key 同款 */
  function isoTodayBJ() {
    var d = new Date();
    var utc = d.getTime() + d.getTimezoneOffset() * 60 * 1000;
    var bj = new Date(utc + 8 * 3600 * 1000);
    return bj.toISOString().slice(0, 10);
  }

  // ─── 启动 ──────────────────────────────────────────────────────────────
  document.addEventListener("DOMContentLoaded", bootstrap);
  </script>
</body>
</html>
