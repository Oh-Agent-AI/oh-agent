<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200" role="img" aria-labelledby="t d">
<title id="t">Agent Vitals v1.0.0 可选配置线框</title><desc id="d">展示预算、账单导入、价格更新与隐私数据控制四个可选设置场景。</desc>
<defs><style>
.bg{fill:#f4f6f8}.board{fill:#fff;stroke:#b7bec8;stroke-width:2}.bar{fill:#e9edf2}.card{fill:#fff;stroke:#aeb6c2;stroke-width:2}.soft{fill:#f5f7f9;stroke:#c5cbd3;stroke-width:1.5}.blue{fill:#eef4ff;stroke:#386fca;stroke-width:2}.green{fill:#eff9f3;stroke:#3b8b59;stroke-width:2}.amber{fill:#fff7e3;stroke:#a96d00;stroke-width:2}.red{fill:#fff1f1;stroke:#b43c3c;stroke-width:2}.btn{fill:#222b38}.btn2{fill:#fff;stroke:#7f8996;stroke-width:1.5}.txt{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202733}.muted{fill:#687384}.h1{font-size:30px;font-weight:700}.h2{font-size:22px;font-weight:700}.body{font-size:17px}.small{font-size:14px}.tiny{font-size:12px}.label{font-size:18px;font-weight:600}.num{font-size:26px;font-weight:700}.white{fill:#fff}.blueT{fill:#285daf}.greenT{fill:#2f7249}.amberT{fill:#8b5a00}.redT{fill:#a22b2b}.line{stroke:#87919f;stroke-width:2.5;fill:none}.grid{stroke:#ccd1d8;stroke-width:1}
</style></defs>
<rect class="bg" width="2000" height="1200"/><text class="txt h1" x="48" y="55">04 · 价值出现后的可选配置</text><text class="txt muted body" x="48" y="85">预算、账单、价格和隐私均按需进入；未设置不显示假 0，也不影响 L0 用量与名义成本。</text>

<!-- Budget -->
<g transform="translate(48 120)"><rect class="board" width="930" height="470" rx="16"/><rect class="bar" width="930" height="54" rx="16"/><rect class="bar" y="35" width="930" height="19"/><text class="txt label" x="32" y="34">预算与提醒</text>
<text class="txt h2" x="38" y="98">观察预算</text><text class="txt muted small" x="38" y="126">基于按量估算，适合账单尚未到时观察；提醒不会阻止 Agent 使用。</text>
<rect class="soft" x="38" y="151" width="854" height="75" rx="10"/><text class="txt label" x="60" y="183">尚未设置预算</text><text class="txt muted small" x="60" y="207">不会显示 ¥0 或“当前安全”。</text><rect class="btn" x="748" y="166" width="122" height="44" rx="8"/><text class="txt white small" x="778" y="194">设置预算</text>
<text class="txt label" x="38" y="269">设置月预算</text><rect class="card" x="38" y="287" width="190" height="52" rx="8"/><text class="txt small" x="58" y="319">周期：每月 ▾</text><rect class="card" x="244" y="287" width="170" height="52" rx="8"/><text class="txt small" x="264" y="319">币种：CNY ▾</text><rect class="card" x="430" y="287" width="190" height="52" rx="8"/><text class="txt small" x="450" y="319">金额：¥ 5,000</text>
<rect class="blue" x="38" y="356" width="582" height="62" rx="9"/><text class="txt blueT small" x="58" y="382">提醒阈值：80% 与 100%　·　本周期各提醒一次</text><text class="txt blueT tiny" x="58" y="404">启用通知时才请求系统权限；可设置静默时段。</text><rect class="btn" x="740" y="365" width="130" height="46" rx="8"/><text class="txt white small" x="774" y="394">启用预算</text></g>

