<!-- Pricing -->
<g transform="translate(48 630)"><rect class="board" width="930" height="470" rx="16"/><rect class="bar" width="930" height="54" rx="16"/><rect class="bar" y="35" width="930" height="19"/><text class="txt label" x="32" y="34">价格与显示</text>
<rect class="green" x="38" y="80" width="854" height="90" rx="10"/><text class="txt greenT label" x="60" y="112">当前目录可用 · v2026.09.10</text><text class="txt muted small" x="60" y="140">上次检查 15:40 · 内置目录 + 已验证远端更新 · 128 个模型</text><rect class="btn2" x="748" y="101" width="122" height="44" rx="8"/><text class="txt small" x="779" y="129">立即检查</text>
<text class="txt label" x="38" y="211">价格来源与历史有效期</text><rect class="card" x="38" y="230" width="854" height="88" rx="10"/><text class="txt body" x="60" y="262">OpenAI 官方公开价格</text><text class="txt muted small" x="60" y="289">抓取时间不是生效时间；历史价格按快照区间匹配。</text><text class="txt blueT small" x="786" y="276">查看依据</text>
