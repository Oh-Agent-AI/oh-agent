<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2450" viewBox="0 0 1600 2450" role="img" aria-labelledby="title desc">
  <title id="title">Agent City 机甲战棋：PvE / PvP 共享架构</title>
  <desc id="desc">当前部分共享草稿、棋盘查询和远程会话；目标抽取共享领域核心并保留 PvE 和 PvP 策略。客户端预检不是远程权威，桌面 MatchSession 负责正式校验和结算，中继只转发。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101a2a"/><stop offset="1" stop-color="#0b1220"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8Z" fill="#8ba5bc"/></marker>
    <style>
      text {font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill:#ecf3fa}
      .title {font-size:40px;font-weight:750;letter-spacing:1px}.sub {font-size:20px;fill:#a5b8cb}.section {font-size:25px;font-weight:700}.tag {font-size:16px;font-weight:700;letter-spacing:.5px}.h {font-size:23px;font-weight:700}.body {font-size:19px;fill:#c3d2df}.small {font-size:17px;fill:#aabed0}.tiny {font-size:16px;fill:#aabed0}.mono {font-size:17px;fill:#9db4c7;font-family:ui-monospace, SFMono-Regular, monospace}
      .shell {fill:#142337;stroke:#2e4358;stroke-width:1.5}.card {fill:#182b3e;stroke:#36516a;stroke-width:1.5}.planned {fill:#172c42;stroke:#5baac4;stroke-width:2}.mode {fill:#312b38;stroke:#aa846b;stroke-width:1.7}.line {fill:none;stroke:#8ba5bc;stroke-width:2;marker-end:url(#arrow)}.hint {fill:none;stroke:#7796ac;stroke-width:1.5;stroke-dasharray:6 6}.accent {fill:#88e1d4}.blue {fill:#a1d5ed}.amber {fill:#f4ca92}.white {fill:#fff}
    </style>
  </defs>
  <rect width="1600" height="2450" rx="20" fill="url(#bg)"/>
  <text x="64" y="70" class="tag accent">AGENT CITY  /  MECHA ARCHITECTURE</text>
  <text x="64" y="125" class="title">PvE × PvP：共享机制，保留玩法</text>
  <text x="64" y="163" class="sub">架构提案 · 从当前工作区出发 · 目标结构不代表已实现</text>
  <g transform="translate(1008 73)">
    <circle cx="0" cy="0" r="6" fill="#80d4c8"/><text x="16" y="6" class="small">已有复用</text>
    <circle cx="140" cy="0" r="6" fill="#83cce9"/><text x="156" y="6" class="small">待抽取</text>
    <circle cx="270" cy="0" r="6" fill="#f0bf83"/><text x="286" y="6" class="small">模式差异</text>
  </g>

  <!-- Existing baseline -->
  <rect x="48" y="205" width="1504" height="342" rx="18" class="shell"/>
  <text x="78" y="252" class="section">01  当前实现</text><text x="264" y="252" class="small">已有共享基础，但并非统一结算与统一界面</text>
  <rect x="78" y="277" width="455" height="230" rx="12" class="card"/>
  <text x="100" y="313" class="tag accent">已有复用</text><text x="100" y="350" class="h">规划 + 部分战场查询</text>
  <text x="100" y="385" class="body">草稿、计划组装、预检封装</text>
  <text x="100" y="416" class="body">属性、路径、目标与射线查询</text>
  <text x="100" y="460" class="small">PvP 暂将敌机投影为 Raider 形态</text>
  <text x="100" y="486" class="small">仅复用查询，不是统一战斗模型</text>
  <rect x="573" y="277" width="455" height="230" rx="12" class="card"/>
  <text x="595" y="313" class="tag amber">仍然分开</text><text x="595" y="350" class="h">整包校验 + 行动结算</text>
  <text x="595" y="385" class="body">PvE：combat.ts / rules.ts</text>
  <text x="595" y="416" class="body">PvP：rules/pvp.ts</text>
  <text x="595" y="460" class="small">两边均含移动、行动、落空等循环</text>
  <text x="595" y="486" class="small">细节和事件语义并不完全相同</text>
  <rect x="1068" y="277" width="454" height="230" rx="12" class="card"/>
  <text x="1090" y="313" class="tag accent">远程已有复用</text><text x="1090" y="350" class="h">MatchSession + 模式适配器</text>
  <text x="1090" y="385" class="body">远程 PvE / PvP 共用会话协议</text>
  <text x="1090" y="416" class="body">本地 PvE 仍由 controller 直调规则</text>
  <text x="1090" y="460" class="small">本地 / 远程 UI 和 3D 编排仍独立</text>
  <text x="1090" y="486" class="small">远程试算不是最终权威结果</text>

  <!-- Proposed architecture -->
  <text x="78" y="610" class="section">02  目标结构</text><text x="264" y="610" class="small">一次抽取一个边界，代码复用 ≠ 强制玩法一致</text>
  <rect x="78" y="642" width="681" height="100" rx="12" class="card"/>
  <text x="100" y="682" class="h">本地 City 界面</text><text x="100" y="716" class="small">现有 controller · 3D 场景 · 本地输入</text>
  <rect x="841" y="642" width="681" height="100" rx="12" class="card"/>
  <text x="863" y="682" class="h">远程浏览器界面</text><text x="863" y="716" class="small">快照 · 草稿 · 浏览器 3D 场景</text>
  <path d="M420 742 V777 H596 V803" class="line"/><path d="M1182 742 V777 H1004 V803" class="line"/>
  <rect x="320" y="805" width="960" height="114" rx="12" class="planned"/>
  <text x="348" y="844" class="h">共享规划 / 展示模型</text><text x="1002" y="844" class="tag blue">部分已有 · 继续抽取</text>
  <text x="348" y="880" class="body">草稿与选中、目标确认、试算状态、战术标记与回看模型</text>
  <text x="348" y="905" class="tiny">界面及渲染容器按平台适配；移动投影不等于合法性验证</text>
  <path d="M800 919 V964" class="line"/>
  <rect x="78" y="968" width="308" height="334" rx="14" class="mode"/>
  <text x="102" y="1007" class="tag amber">模式策略 · 保留差异</text><text x="102" y="1046" class="h">PvE</text>
  <text x="102" y="1086" class="body">Boss / Raider / 建筑</text><text x="102" y="1118" class="body">敌方预告与行动</text><text x="102" y="1150" class="body">建筑目标与终局</text><text x="102" y="1182" class="body">Boss 位移 / 碰撞</text>
  <text x="102" y="1246" class="mono">mecha-v1.4</text><text x="102" y="1275" class="tiny">保留现有规则语义</text>
  <rect x="419" y="968" width="762" height="334" rx="14" class="planned"/>
  <text x="446" y="1007" class="tag blue">共享领域核心 · 待分阶段抽取</text><text x="446" y="1046" class="h">中立战场 + 计划 + 行动流程</text>
  <text x="446" y="1087" class="body">01  棋盘、单位、阵营与占位 / 路径查询</text>
  <text x="446" y="1121" class="body">02  计划完整性、批量移动与终点冲突</text>
  <text x="446" y="1155" class="body">03  行动校验、目标绑定、执行时重查</text>
  <text x="446" y="1189" class="body">04  按序结算、落空、事件与阶段结果</text>
  <text x="446" y="1245" class="small">预检与权威共用对应阶段；预检目标为无副作用</text>
  <text x="446" y="1275" class="small">伤害、击退、冷却和终局由模式策略决定</text>
  <rect x="1214" y="968" width="308" height="334" rx="14" class="mode"/>
  <text x="1238" y="1007" class="tag amber">模式策略 · 保留差异</text><text x="1238" y="1046" class="h">PvP</text>
  <text x="1238" y="1086" class="body">A / B 双方机甲</text><text x="1238" y="1118" class="body">轮次与行动权限</text><text x="1238" y="1150" class="body">对手机甲防御</text><text x="1238" y="1182" class="body">全歼 / 认输 / 限回合</text>
  <text x="1238" y="1246" class="mono">mecha-pvp:v1</text><text x="1238" y="1275" class="tiny">当前不含 PvE 式击退</text>
  <path d="M386 1124 H414" class="line"/><path d="M1214 1124 H1186" class="line"/>
  <text x="78" y="1340" class="small">策略注入共享流程；是否调整击退、碰撞或其他规则，须单独评审而非静默改变。</text>

  <!-- deployment -->
  <rect x="48" y="1372" width="1504" height="310" rx="18" class="shell"/>
  <text x="78" y="1419" class="section">03  运行路径与权威</text><text x="390" y="1419" class="small">下列路径分别在不同运行时调用同一代码库的规则实现</text>
  <rect x="78" y="1445" width="562" height="192" rx="12" class="card"/>
  <text x="100" y="1484" class="tag accent">本地 PVE</text>
  <text x="100" y="1524" class="body">City 界面 → 本地 controller → PvE 规则</text>
  <text x="100" y="1560" class="body">本地正式结算 → 本地状态 / 演出</text>
  <text x="100" y="1609" class="small">当前不经过 MatchSession 或 relay</text>
  <rect x="670" y="1445" width="852" height="192" rx="12" class="card"/>
  <text x="692" y="1484" class="tag accent">远程 PVE / PVP</text>
  <text x="692" y="1524" class="body">浏览器预检 → 提交计划 → relay 转发 → 桌面权威宿主</text>
  <text x="692" y="1560" class="body">MatchSession 鉴权 / 复验 / 结算 → 权威快照与事件</text>
  <text x="692" y="1609" class="small">预检非权威；relay 不执行规则；TLS 不等于端到端加密</text>

  <text x="78" y="1744" class="section">04  落地顺序</text><text x="264" y="1744" class="small">优先保证玩法等价，再逐层复用</text>
  <g>
    <rect x="78" y="1772" width="339" height="136" rx="12" class="card"/><text x="100" y="1809" class="tag accent">P0 · 固定基线</text><text x="100" y="1844" class="body">对照状态、事件和错误</text><text x="100" y="1876" class="small">记录 PvE / PvP 现有差异</text>
    <rect x="436" y="1772" width="339" height="136" rx="12" class="card"/><text x="458" y="1809" class="tag blue">P1 · 查询与计划</text><text x="458" y="1844" class="body">战场视图、移动、绑定</text><text x="458" y="1876" class="small">逐步替代假 Raider 投影</text>
    <rect x="794" y="1772" width="339" height="136" rx="12" class="card"/><text x="816" y="1809" class="tag blue">P2 · 行动流程</text><text x="816" y="1844" class="body">顺序、落空、事件骨架</text><text x="816" y="1876" class="small">模式策略保留原有语义</text>
    <rect x="1152" y="1772" width="370" height="136" rx="12" class="card"/><text x="1174" y="1809" class="tag blue">P3 / P4 · 体验与实机</text><text x="1174" y="1844" class="body">隔离预检、共用交互模型</text><text x="1174" y="1876" class="small">布局 / 无障碍 / 真实远程验收</text>
  </g>

  <!-- Host room variants -->
  <text x="78" y="1980" class="section">05  同一个房间：房主参赛或观战</text>
  <text x="615" y="1980" class="small">目标设计 · 两个好友 + 桌面观战尚未实现</text>
  <rect x="78" y="2010" width="1444" height="98" rx="12" class="planned"/>
  <text x="102" y="2049" class="h">桌面权威宿主 + 房间管理</text>
  <text x="513" y="2049" class="body">同一 PvP 规则、状态、事件、协议与授权边界</text>
  <text x="102" y="2084" class="small">管理者不必占玩家席位；中继只转发；桌面失联时不承诺云端继续结算</text>
  <path d="M438 2108 V2145" class="line"/><path d="M1162 2108 V2145" class="line"/>
  <rect x="78" y="2148" width="700" height="168" rx="12" class="card"/>
  <text x="102" y="2187" class="tag accent">配置 01  /  房主参赛</text>
  <text x="102" y="2226" class="body">A 房主本人  +  B 受邀好友</text>
  <text x="102" y="2262" class="small">已有远程链接参赛；桌面直接参赛待开发</text>
  <text x="102" y="2291" class="small">统一桌面战场：参赛可操作，观战只读</text>
  <rect x="822" y="2148" width="700" height="168" rx="12" class="planned"/>
  <text x="846" y="2187" class="tag blue">配置 02  /  房主组局观战 · 待开发</text>
  <text x="846" y="2226" class="body">A 好友 1  +  B 好友 2  +  房主只读观战</text>
  <text x="846" y="2262" class="small">独立邀请和批准、席位授权、桌面权威快照同步</text>
  <text x="846" y="2291" class="small">观众不能提交 / 认输；房主不向好友转交自身凭证</text>
  <rect x="78" y="2350" width="1444" height="60" rx="10" class="mode"/>
  <text x="102" y="2387" class="small">两条交付线可并行：房间与观战复用现有 PvP 适配器；共享核心逐步提取，不强制等待重构后才开发组局。</text>

</svg>
