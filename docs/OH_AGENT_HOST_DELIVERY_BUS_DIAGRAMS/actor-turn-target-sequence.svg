<text x="362.0" y="300" text-anchor="middle" font-size="11.5" fill="#333">in_flight 超 replyTTL → 回 pending（redelivered 标注）</text>
<rect x="726" y="260" width="200" height="66" rx="8" fill="#f7f7f9" stroke="#b45f06" stroke-width="1.6"/>
