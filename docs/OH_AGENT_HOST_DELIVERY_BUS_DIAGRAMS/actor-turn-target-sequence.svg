<text x="245.0" y="440" text-anchor="middle" font-size="14" font-weight="600" fill="#444">已实现（at-most-once 基线，feature 分支）</text>
<text x="245.0" y="460" text-anchor="middle" font-size="11.5" fill="#333">host_deliveries 表 + post/wait + 惰性过期</text>
<text x="245.0" y="477" text-anchor="middle" font-size="11.5" fill="#333">满箱丢最旧 + droppedOldest 标注</text>
<text x="245.0" y="494" text-anchor="middle" font-size="11.5" fill="#333">dedupe 幂等 · 多主体隔离 · fetch+ack 事务</text>
<rect x="470" y="420" width="400" height="130" rx="8" fill="#f2fbf4" stroke="#1a7f37" stroke-width="1.6" stroke-dasharray="6,4"/>
<text x="670.0" y="440" text-anchor="middle" font-size="14" font-weight="600" fill="#1a7f37">W7 增量 D-6（未实现）</text>
<text x="670.0" y="460" text-anchor="middle" font-size="11.5" fill="#333">in_flight 状态 + creator_actor_turn_confirm</text>
<text x="670.0" y="477" text-anchor="middle" font-size="11.5" fill="#333">replyTTL 重排队（redelivered 标注）</text>
<text x="670.0" y="494" text-anchor="middle" font-size="11.5" fill="#333">Agent 侧 eventId 去重</text>
