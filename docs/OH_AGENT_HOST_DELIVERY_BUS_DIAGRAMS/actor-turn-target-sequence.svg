<text x="1105.0" y="460" text-anchor="middle" font-size="11.5" fill="#333">city.story.read 现走 legacy gameId 映射</text>
<text x="1105.0" y="477" text-anchor="middle" font-size="11.5" fill="#333">玩家看回复需要同 Run 作用域读取面</text>
