<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<rect width="1360" height="620" fill="white"/>
<text x="680.0" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#111">actor.turn 目标时序（W7：at-least-once + 回合确认）— 设计目标，D-6 未实现</text>
<text x="680.0" y="56" text-anchor="middle" font-size="12" fill="#b45f06">现状基线 = at-most-once（fetch 即 delivered）；本图是评审修订后的目标语义</text>
<rect x="30" y="90" width="200" height="84" rx="8" fill="#f2fbf4" stroke="#1a7f37" stroke-width="1.6" stroke-dasharray="6,4"/>
<text x="130.0" y="110" text-anchor="middle" font-size="14" font-weight="600" fill="#1a7f37">1. 玩家提交输入</text>
<text x="130.0" y="130" text-anchor="middle" font-size="11.5" fill="#333">City WebView：说话/动作</text>
<text x="130.0" y="147" text-anchor="middle" font-size="11.5" fill="#333">city.story.commit</text>
<rect x="262" y="90" width="200" height="84" rx="8" fill="#f2fbf4" stroke="#1a7f37" stroke-width="1.6" stroke-dasharray="6,4"/>
<text x="362.0" y="110" text-anchor="middle" font-size="14" font-weight="600" fill="#1a7f37">2. Host 原子记录事实+待处理回合</text>
<text x="362.0" y="130" text-anchor="middle" font-size="11.5" fill="#333">story_events 落库（权威）+ post(actor.turn)</text>
<text x="362.0" y="147" text-anchor="middle" font-size="11.5" fill="#333">dedupeKey=eventId · 满箱丢最旧+标注</text>
<rect x="494" y="90" width="200" height="84" rx="8" fill="#f2fbf4" stroke="#1a7f37" stroke-width="1.6" stroke-dasharray="6,4"/>
<text x="594.0" y="110" text-anchor="middle" font-size="14" font-weight="600" fill="#1a7f37">3. Actor 领取回合</text>
<text x="594.0" y="130" text-anchor="middle" font-size="11.5" fill="#333">claim_wait：fetch+in_flight 同事务</text>
<text x="594.0" y="147" text-anchor="middle" font-size="11.5" fill="#333">at-least-once：断线→replyTTL 后重排队</text>
<rect x="726" y="90" width="200" height="84" rx="8" fill="#f2fbf4" stroke="#1a7f37" stroke-width="1.6" stroke-dasharray="6,4"/>
<text x="826.0" y="110" text-anchor="middle" font-size="14" font-weight="600" fill="#1a7f37">4. 提交绑定回复</text>
<text x="826.0" y="130" text-anchor="middle" font-size="11.5" fill="#333">intent.speak 绑定同 storyRunId</text>
<text x="826.0" y="147" text-anchor="middle" font-size="11.5" fill="#333">+ 触发 eventId（幂等去重）</text>
<rect x="958" y="90" width="200" height="84" rx="8" fill="#f2fbf4" stroke="#1a7f37" stroke-width="1.6" stroke-dasharray="6,4"/>
<text x="1058.0" y="110" text-anchor="middle" font-size="14" font-weight="600" fill="#1a7f37">5. 确认回合</text>
<text x="1058.0" y="130" text-anchor="middle" font-size="11.5" fill="#333">commit 成功 → confirmed</text>
<text x="1058.0" y="147" text-anchor="middle" font-size="11.5" fill="#333">replyTTL 超时未确认 → 重排队</text>
<rect x="1150" y="90" width="200" height="84" rx="8" fill="#f2fbf4" stroke="#1a7f37" stroke-width="1.6" stroke-dasharray="6,4"/>
<text x="1250.0" y="110" text-anchor="middle" font-size="14" font-weight="600" fill="#1a7f37">6. City 读取回复</text>
<text x="1250.0" y="130" text-anchor="middle" font-size="11.5" fill="#333">同 Run 读取接口（缺口 G-READ）</text>
<text x="1250.0" y="147" text-anchor="middle" font-size="11.5" fill="#333">legacy read 按 gameId 映射，需新面</text>
