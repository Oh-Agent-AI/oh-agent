    <linearGradient id="romance" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#E7C7D8"/><stop offset="1" stop-color="#9B83B6"/></linearGradient>
    <linearGradient id="flight" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#C6D9ED"/><stop offset="1" stop-color="#6B94BB"/></linearGradient>
    <linearGradient id="race" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#263F52"/><stop offset="1" stop-color="#121F30"/></linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1B5147"/><stop offset="1" stop-color="#123A33"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#183B36" flood-opacity=".09"/></filter>
