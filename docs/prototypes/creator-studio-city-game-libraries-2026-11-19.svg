<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Creator Studio City、Story 与 Game 三类资源库原型</title>
  <desc id="desc">City 项目、City AVG Story 和 Game 构建分别管理，Game 可独立预览并安装到指定 City。</desc>
