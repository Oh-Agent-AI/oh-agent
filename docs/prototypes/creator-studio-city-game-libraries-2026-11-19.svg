      .cardTitle { font-size: 16px; font-weight: 650; fill: #1B302C; }
      .buttonText { font-size: 13px; font-weight: 600; text-anchor: middle; }
      .section { font-size: 14px; font-weight: 650; fill: #29433D; }
    </style>
