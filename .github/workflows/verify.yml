name: Verify

# 这条流水线的存在理由，写在 ENGINEERING §6.7 的反面：
#
#   **绝对不做**：同时维护 Python scan.py 与 Rust CLI 两套扫描器。
#   两套实现必然发散，而发散处就是那 12 条不变量。
#
# 现阶段我们**明知故犯**：main 以 Python 为主，Rust 在 refactor/rust-port
# 上追平，等稳定了再合。这是分阶段收敛的取舍，但它只有在发散被**当天**
# 发现时才成立 —— 否则就退化成那条规则警告的情形。
#
# 所以这里的核心不是「跑测试」，是 differential 那个 job：
# 两个实现跑同一份 golden，不一致就红。

on:
  push:
    branches: [main, "refactor/**", "merge/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      city_exhaustive:
        description: Run the City heavy guards with their complete seed sets
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  catalog_contract:
    name: 官方目录发布契约
    # Python 3.9 binaries are published for 24.04; ubuntu-latest now selects 26.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: 检查兼容镜像及 commit-pinned payload
        run: python3 scripts/verify_catalog.py

  # ── 0. 这个分支上有没有 Rust ────────────────────────────
  #
  # 探测**必须是独立 job**，不能是 job 内的第一个 step。
  #
  # 早先的写法是每个 job 自己探一次，再给每个 step 挂 `if:`。结果在纯
  # Python 的 main 上，「Rust 单元测试」和「双实现差分」一个 step 都没
  # 执行，却双双报 success —— checks 页面上「没跑」与「跑过且通过」长得
  # 一模一样。这正是本仓库自己禁掉的东西（ARCHITECTURE §3.1 的
  # null ≠ 0，「缺一列的报告有价值，编一列的没有」）：一个绿勾在声称
  # 两个实现比对过，而它一次都没比。
  #
  # 挂在 job 级的 `if:` 会让 GitHub 把整个 job 标成灰色 Skipped，
  # 与 Success 在视觉上可区分。
  probe:
    name: 探测 Rust
    runs-on: ubuntu-latest
    outputs:
      has_cargo: ${{ steps.p.outputs.has_cargo }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: echo "has_cargo=$([ -f Cargo.toml ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"

  # ── 1. Python 侧：oracle 本身必须是绿的 ──────────────────
  python:
    name: Python 套件
    # Python 3.9 binaries are published for 24.04; ubuntu-latest now selects 26.04.
    runs-on: ubuntu-24.04
    env:
      # Broad compatibility tests use the product's explicit Asia/Shanghai
      # fixture timezone; focused timezone tests still exercise other zones.
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9" # 仓库声明支持 3.8+，按下限跑
      - name: 安装 hypothesis（属性测试的可选依赖）
        run: pip install hypothesis zstandard
      - name: 全套测试
        run: python -m unittest discover tests -v
      - name: golden 比对（Python 实现）
        run: python tests/golden_runner.py

  # ── 2. Rust 侧 ───────────────────────────────────────────
  rust:
    name: Rust 单元测试
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    # 没有 Cargo.toml 的分支（比如纯 Python 的 main）整个 job 跳过，
    # 在 checks 页面显示为灰色 Skipped —— 不是绿色 Success。
    needs: probe
    if: needs.probe.outputs.has_cargo == 'yes'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --release
      - name: clippy（扫描路径上不得有 unwrap —— ENGINEERING §4.5）
        run: cargo clippy --release --all-targets -- -D warnings

  # ── 3. 差分：本流水线的重点 ──────────────────────────────
  differential:
    name: 双实现差分
    # Python 3.9 binaries are published for 24.04; ubuntu-latest now selects 26.04.
    runs-on: ubuntu-24.04
    env:
      TZ: Asia/Shanghai
    needs: probe
    if: needs.probe.outputs.has_cargo == 'yes'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 构建
        run: cargo build --release
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # 构建器是 packages/city-game-sdk/scripts/buildGame.ts，它直接 import esbuild。
      # 干净检出没有这个 node_modules 时，进程在写出诊断前以空 stdout 退出，
      # 宿主把它记成 game_build_failed，而不是「源码有类型错误」。
      - name: 安装 Code Game 构建器依赖
        run: |
          npm ci --prefix packages/agent-vitals-city-sdk
          npm run build --prefix packages/agent-vitals-city-sdk
          npm ci --prefix packages/city-game-sdk
      - name: Code Game 创作闭环（真实 MCP stdio）
        env:
          AGENT_VITALS_BIN: ${{ github.workspace }}/target/release/agent-vitals
        run: node scripts/verify-code-game-loop.mjs
      - name: Code Game 发布/安装（Experience V2）
        env:
          AGENT_VITALS_BIN: ${{ github.workspace }}/target/release/agent-vitals
        run: node scripts/verify-code-game-publish.mjs

      # golden 是提交进仓库的快照。两个实现都必须与它逐字节一致 ——
      # 一致性是三方的，不是两两的：Python↔golden、Rust↔golden。
      - name: golden 比对（Python）
        run: python tests/golden_runner.py --diff
      - name: golden 比对（Rust）
        env:
          # 必须是绝对路径：golden_runner 把扫描器的 cwd 设成语料目录，
          # 相对路径在那里解析不到（本地一直用 $PWD/... 所以没撞上）。
          AGENT_VITALS_BIN: ${{ github.workspace }}/target/release/agent-vitals
        run: python tests/golden_runner.py --diff

      # 集成套件本身就是语言无关的（ENGINEERING §1.4）：
      # 唯一与实现绑定的就是这个环境变量。
      - name: 集成套件指向二进制
        env:
          # 必须是绝对路径：golden_runner 把扫描器的 cwd 设成语料目录，
          # 相对路径在那里解析不到（本地一直用 $PWD/... 所以没撞上）。
          AGENT_VITALS_BIN: ${{ github.workspace }}/target/release/agent-vitals
        run: |
          pip install hypothesis zstandard
          python -m unittest discover tests

      # 假宿主：验运行时适配器的**成功路径**。
      # 没有这一条，Codex/OpenClaw 的子进程链路在 CI 上永远测不到。
      - name: 假宿主成功路径（双实现）
        run: |
          python -m unittest tests.test_harness_stubs
          AGENT_VITALS_BIN="$GITHUB_WORKSPACE/target/release/agent-vitals" \
            python -m unittest tests.test_harness_stubs

  # ── 4. 降级：畸形语料不得中断扫描（ENGINEERING §4.5）─────
  degradation:
    name: 畸形语料不中断扫描
    # Python 3.9 binaries are published for 24.04; ubuntu-latest now selects 26.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      # CI 常以 root 跑，chmod 000 对 root 无效，那条用例会自动跳过。
      # 其余畸形输入（截断 frontmatter、非 UTF-8、空文件）照常覆盖。
      - name: 降级用例
        run: python -m unittest tests.test_degradation -v

  # ── 5. 语料可复现性 ─────────────────────────────────────
  # golden 的价值全部建立在「同一份代码在任何机器上产出同样字节」之上。
  # 这一条在**另一个操作系统**上再跑一遍：macOS 与 Linux 的文件系统顺序、
  # ctime 语义、路径大小写都不同，能对上才说明隔离真的做到了。
  reproducible:
    name: 跨平台可复现
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: golden 比对（macOS）
        run: python tests/golden_runner.py --diff

  windows:
    name: Windows 隔离与可复现
    runs-on: windows-latest
    env:
      # Python 3.9 on Windows otherwise decodes subprocess output with the
      # active ANSI code page, while the CLI deliberately emits UTF-8.
      PYTHONUTF8: "1"
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - name: Set deterministic test timezone
        run: tzutil /s "China Standard Time"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install optional test dependencies
        run: pip install hypothesis zstandard tzdata
      - name: 全套测试
        run: python -m unittest discover tests -v
      - name: golden 比对（Windows）
        run: python tests/golden_runner.py --diff

  # ── 6. 桌面发布契约 ─────────────────────────────────────
  # 发布 workflow 不在普通 PR 上签名或公证，但它的关键门禁必须持续可见；
  # 这里只做无副作用的静态契约检查。
  desktop_release_contract:
    name: 桌面发布契约
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 检查桌面发布 workflow 门禁
        run: |
          node scripts/verify-release-desktop-workflow.mjs
          node scripts/verify-desktop-platforms.mjs
          node scripts/test-run-npm.mjs
          node scripts/test-city-sdk-link-prep.mjs
          node scripts/test-desktop-release-artifacts.mjs
          node scripts/test-macos-signature-contract.mjs

  city_guards:
    name: City 快速守卫
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            apps/desktop/ui-dev/package-lock.json
            apps/agent-city/ui/package-lock.json
            apps/creator-studio/ui/package-lock.json
            packages/agent-vitals-city-sdk/package-lock.json
      - name: 安装守卫依赖
        working-directory: apps/desktop/ui-dev
        run: npm ci
      - name: 安装 City 插件依赖
        working-directory: apps/agent-city/ui
        run: npm ci
      - name: 安装 City SDK 依赖
        working-directory: packages/agent-vitals-city-sdk
        run: npm ci
      - name: 构建 City SDK（types + dist）
        working-directory: packages/agent-vitals-city-sdk
        run: npm run build
      # esbuild 从 creator-studio 源文件向上找 @oh-agent/city-sdk。本 job 只装了
      # city-sdk 与 city 插件时，这条解析在进 bundle 字节比较之前就失败。
      - name: 安装 Creator Studio 依赖
        working-directory: apps/creator-studio/ui
        run: npm ci
      # 嵌入式语义闸 bundle 的输入是 city-sdk + Studio 适配器；SDK 改了却忘记重生成，
      # bundle 会继续用旧校验器（lockfile 与 vectors 都拦不住——它们只证明"自洽"）。
      - name: 嵌入式语义闸 bundle 锁步
        run: node apps/desktop/src-tauri/embedded_city_sdk/build.mjs --check
      # 真机 Studio 回归脚本的自检（helper/断言语义）；live 模式需要桌面宿主 + 前台
      # Creator Studio，不能在 CI 跑。
      - name: Studio MCP 回归脚本自检
        run: node scripts/verify-studio-mcp-loop.mjs --self-test
      - name: City 专项守卫
        working-directory: apps/desktop/ui-dev
        run: node ../../../scripts/verify-city-suite.mjs fast
      - name: City initial data-loading feedback
        run: node scripts/verify-city-initial-loading.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Code Game 渲染端口（Three）
        working-directory: apps/agent-city/ui
        run: node --experimental-transform-types --import ../../../scripts/mecha-ts-register.mjs --test tests/code-game-three-render.test.ts
      - name: 术语与命名边界守卫
        working-directory: apps/desktop/ui-dev
        run: node ../../../scripts/verify-harness-terminology.mjs
      # Studio 侧这两个守卫不加载城市，因此不在 city-kit 清单里；它们只用到本 job 已装好的
      # esbuild，接在这里避免"只能人手跑"（PR #49 的导出点击与 Studio 重建行为）。
      - name: Studio 守卫（导出点击 / Studio 重建）
        run: |
          node scripts/verify-export-click.mjs
          node scripts/verify-studio-reload-project.mjs

  city_heavy_guards:
    name: City heavy guard (${{ matrix.guard }})
    # Exhaustive City planning is available on demand. Keeping these guards out
    # of every PR avoids repeated multi-minute seed generation while preserving
    # the full checks for an explicit dispatch.
    if: github.event_name == 'workflow_dispatch' && inputs.city_exhaustive
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        guard: [road-report, geography, seaside, seaside-tier10, planning, infrastructure, layout, cinematic, cross-engine, context, solve, survey-acceptance, survey-tuning]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            apps/desktop/ui-dev/package-lock.json
            apps/agent-city/ui/package-lock.json
            packages/agent-vitals-city-sdk/package-lock.json
      - name: 安装守卫依赖
        working-directory: apps/desktop/ui-dev
        run: npm ci
      - name: 安装 City 插件依赖
        working-directory: apps/agent-city/ui
        run: npm ci
      - name: 安装 City SDK 依赖
        working-directory: packages/agent-vitals-city-sdk
        run: npm ci
      - name: 构建 City SDK（types + dist）
        working-directory: packages/agent-vitals-city-sdk
        run: npm run build
      - name: 运行独立守卫
        working-directory: apps/desktop/ui-dev
        env:
          CITY_GUARDS_EXHAUSTIVE: ${{ inputs.city_exhaustive && '1' || '0' }}
        run: |
          case "${{ matrix.guard }}" in
            road-report) node ../../../scripts/verify-city-road-report.mjs ;;
            geography) node ../../../scripts/verify-react-city-geography.mjs ;;
            seaside) node ../../../scripts/verify-react-city-seaside.mjs ;;
            seaside-tier10) CITY_SEASIDE_TIER=10 node ../../../scripts/verify-react-city-seaside.mjs ;;
            planning) node ../../../scripts/verify-city-planning.mjs ;;
            infrastructure) node ../../../scripts/verify-react-city-infrastructure.mjs ;;
            layout) node ../../../scripts/verify-react-city-layout.mjs ;;
            cinematic) node ../../../scripts/verify-react-city-cinematic.mjs ;;
            cross-engine) node ../../../scripts/verify-city-cross-engine.mjs ;;
            context) node ../../../scripts/verify-city-context.mjs ;;
            solve) node ../../../scripts/verify-city-solve.mjs ;;
            survey-acceptance) node ../../../scripts/verify-city-survey.mjs --set acceptance ;;
            survey-tuning) node ../../../scripts/verify-city-survey.mjs --set tuning ;;
          esac

  city_game_runtime:
    name: City game runtime SDK
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/agent-vitals-city-sdk/package-lock.json
      - name: 安装 City SDK 依赖
        working-directory: packages/agent-vitals-city-sdk
        run: npm ci
      - name: 构建 City SDK（types + dist）
        working-directory: packages/agent-vitals-city-sdk
        run: npm run build
      - name: 链接游戏运行时 SDK 到 City SDK
        run: |
          mkdir -p packages/agent-vitals-city-game-runtime/node_modules/@oh-agent
          ln -s ../../../agent-vitals-city-sdk packages/agent-vitals-city-game-runtime/node_modules/@oh-agent/city-sdk
      - name: 游戏运行时 SDK 测试与类型检查
        run: |
          npm test --prefix packages/agent-vitals-city-game-runtime
          npm run typecheck --prefix packages/agent-vitals-city-game-runtime

  city_game_sdk:
    name: City game SDK
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            packages/city-game-sdk/package-lock.json
            packages/agent-vitals-city-sdk/package-lock.json
      # contracts 类型在 city-sdk 的 dist/types，dist 被 gitignore。file: 依赖是
      # 符号链接；不先构建，tsc 报 TS2307，随后 WorldAPIV2 上的 roads/objects
      # 等成员全部变成「不存在」。
      - name: 安装并构建 City SDK
        working-directory: packages/agent-vitals-city-sdk
        run: |
          npm ci
          npm run build
      - name: 安装 City Game SDK 依赖
        working-directory: packages/city-game-sdk
        run: npm ci
      - name: 类型检查
        working-directory: packages/city-game-sdk
        run: npm run typecheck
      - name: 契约测试与构建
        working-directory: packages/city-game-sdk
        run: |
          npm test
          npm run build
      - name: hello-city 纵向切片（构建 + 无头运行）
        run: node --experimental-transform-types --import ./scripts/mecha-ts-register.mjs --test games/hello-city/tests/hello-city.test.ts games/tower-defense/tests/tower-defense.test.ts games/tower-defense/tests/tower-defense.test.ts
      - name: City layout → WorldSource 投影
        run: node --experimental-transform-types --import ./scripts/mecha-ts-register.mjs --test apps/agent-city/ui/tests/code-game-world-source.test.ts
      - name: Code Game 会话租约
        run: node --experimental-transform-types --import ./scripts/mecha-ts-register.mjs --test apps/agent-city/ui/tests/code-game-session.test.ts
      - name: 实时 City layout → WorldSource
        run: node --experimental-transform-types --import ./scripts/mecha-ts-register.mjs --test apps/agent-city/ui/tests/code-game-engine-world-source.test.ts

  creator_evals:
    name: Creator tool-face evals (E9 self-test)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # 确定性判分器自检（T3 对照 §6.2-O2 收尾）：rubric 劣化即红。
      # 不需要 npm ci——run.mjs 只用 node:fs/node:path。
      - name: E9 判分器自检
        run: node evals/creator/run.mjs --self-test
      - name: 用例清单完整性
        run: node evals/creator/run.mjs --list

  city_typed_data:
    name: City typed data adapter tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/agent-city/ui/package-lock.json
      - name: 安装 City 插件依赖
        working-directory: apps/agent-city/ui
        run: npm ci
      - name: 安装 City SDK 依赖
        working-directory: packages/agent-vitals-city-sdk
        run: npm ci
      - name: 构建 City SDK（types + dist）
        working-directory: packages/agent-vitals-city-sdk
        run: npm run build
      - name: typed data 投影与快照契约
        working-directory: apps/agent-city/ui
        run: node --experimental-strip-types --test tests/typed-city-session-adapter.test.ts

  # 机甲战棋的确定性守卫。仓库其它 City 守卫固定 Node 20，而这里用
  # `--experimental-strip-types` 直接跑 .ts 源码（Node ≥ 22.6），所以单独一个
  # job，不把整条 City 守卫链的 Node 版本一起抬上去。测试脚本只做相对导入；
  # 末尾的 build 会安装依赖，确认 Worker 产物真的能打包出来。
  mecha_guards:
    name: Mecha 战棋守卫
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 规则与地形（同步/异步等价、确定性、取消）
        run: |
          node --experimental-strip-types --import ./scripts/mecha-ts-register.mjs --test scripts/verify-mecha-tactics.ts
          node --experimental-strip-types --import ./scripts/mecha-ts-register.mjs --test scripts/verify-mecha-city-site.ts
          node --experimental-strip-types --import ./scripts/mecha-ts-register.mjs --test scripts/verify-mecha-doctrine.ts
          node --experimental-strip-types --import ./scripts/mecha-ts-register.mjs --test scripts/verify-mecha-lease.ts
          node --experimental-strip-types --import ./scripts/mecha-ts-register.mjs --test scripts/verify-mecha-invariants.ts
          node --experimental-strip-types --import ./scripts/mecha-ts-register.mjs --test scripts/verify-mecha-controller.ts
          node --experimental-strip-types --import ./scripts/mecha-ts-register.mjs --test scripts/verify-mecha-search-runner.ts
          node --experimental-strip-types --import ./scripts/mecha-ts-register.mjs --test scripts/verify-mecha-layers.ts
      - name: 安装 City 插件依赖
        working-directory: apps/agent-city/ui
        run: npm ci
      - name: 安装 City SDK 依赖
        working-directory: packages/agent-vitals-city-sdk
        run: npm ci
      - name: 构建 City SDK（types + dist）
        working-directory: packages/agent-vitals-city-sdk
