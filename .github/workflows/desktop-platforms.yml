name: Windows and Linux desktop packages

on:
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'apps/agent-*/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/**'
      - '.github/workflows/desktop-platforms.yml'
      - '.github/workflows/release-desktop.yml'
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

permissions:
  contents: read

jobs:
  packages:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows
            bundles: nsis
          - runner: ubuntu-22.04
            platform: linux
            bundles: deb,appimage
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/ui-dev/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          # 22.04 runner 上 apt 曾无输出挂起 50+ 分钟。除了非交互/超时/重试，
          # 还要处理开机时 unattended-upgrades 持锁 + dpkg 锁等待。
          sudo systemctl stop unattended-upgrades 2>/dev/null || true
          sudo systemctl disable unattended-upgrades 2>/dev/null || true
          timeout 600 sudo -E apt-get update \
            -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
            -o DPkg::Lock::Timeout=600
          timeout 900 sudo -E apt-get install -y --no-install-recommends \
            -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
            -o DPkg::Lock::Timeout=600 \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - name: Verify platform configuration
        run: |
          node scripts/verify-desktop-platforms.mjs
          node scripts/test-run-npm.mjs
          node scripts/test-desktop-release-artifacts.mjs
          node scripts/test-macos-signature-contract.mjs
      - name: Install frontend dependencies
        run: npm ci --prefix apps/desktop/ui-dev
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.11.4 --locked
      - name: Build native desktop installers
        working-directory: apps/desktop/src-tauri
        env:
          NO_STRIP: 'true'
        run: cargo tauri build --ci --bundles ${{ matrix.bundles }}
      - name: Test bundled CLI discovery
        # Windows 的 lib 测试二进制在本仓库当前依赖下启动即
        # STATUS_ENTRYPOINT_NOT_FOUND（0xc0000139，5e9794d3 起已存在，见 run
        # 42962016375），与打包无关。Windows 的真实覆盖在下面
        # "Verify Windows installer CLI"：安装 NSIS 包后检查产品名并运行内置 CLI。
        if: runner.os != 'Windows'
        working-directory: apps/desktop/src-tauri
        run: cargo test --lib resolve_binary_
      - name: Verify Linux package CLI
        if: runner.os == 'Linux'
        run: |
          set -eu
          deb=$(find apps/desktop/src-tauri/target/release/bundle/deb -name '*.deb' -print -quit)
          test -n "$deb"
          dpkg-deb -x "$deb" package-check
          desktop=$(find package-check/usr/share/applications -name '*.desktop' -print -quit)
          test -n "$desktop"
          grep -Fx 'Name=Oh Agent' "$desktop"
          cli=$(find package-check/usr -path '*/bin/agent-vitals' ! -path '*/usr/bin/agent-vitals' -print -quit)
          test -n "$cli"
          test -x "$cli"
          "$cli" --build-info
          test -n "$(find apps/desktop/src-tauri/target/release/bundle/appimage -name '*.AppImage' -print -quit)"
      - name: Verify Windows installer CLI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (!$installer) { throw 'Missing NSIS installer' }
          $installDir = Join-Path $env:RUNNER_TEMP 'Oh Agent package check'
          $process = Start-Process -FilePath $installer.FullName -ArgumentList "/S /D=$installDir" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          $app = Join-Path $installDir 'agent-vitals-menubar.exe'
          if (!(Test-Path $app)) { throw 'Missing desktop executable' }
          if ((Get-Item $app).VersionInfo.ProductName -ne 'Oh Agent') { throw 'Incorrect installed product name' }
          $cli = Join-Path $installDir 'bin/agent-vitals.exe'
          if (!(Test-Path $cli)) { throw 'Missing installed CLI resource' }
          & $cli --build-info
          if ($LASTEXITCODE -ne 0) { throw 'Installed CLI failed' }
      - name: Stage branded installers
        run: node scripts/desktop-release-artifacts.mjs stage ${{ matrix.platform }} x86_64 apps/desktop/src-tauri/target/release/bundle dist/${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-x86_64
          if-no-files-found: error
          path: dist/${{ matrix.platform }}
